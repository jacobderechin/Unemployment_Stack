<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unemployment Stack</title>
<style>
  /* ===========================================================================
     Ledger — design tokens.
     Two orthogonal channels: HUE carries stage meaning, INK carries hierarchy.
     Chrome is achromatic on purpose, so the only color on screen means something.
     Every value here was checked with the dataviz skill's validate_palette.js —
     read the comment above the dark block before changing any of them.
     =========================================================================== */
  :root {
    color-scheme: light;

    --ground:  #e8ebe5;                 /* app background */
    --sunk:    #dfe3db;                 /* kanban column, table head, chips */
    --surface: #ffffff;                 /* cards, panels, tables */

    --ink:   #16191c;                   /* primary text, and primary buttons */
    --ink-2: #5c6560;                   /* secondary text */
    --ink-3: #6e766d;                   /* tertiary text */

    --rule:        #ccd2c8;             /* dividers, card borders */
    --rule-strong: #929c8e;             /* input and control borders */

    /* Stage hues — meaning only, never chrome. The light four are unchanged from
       the original palette: they were already CVD-validated and this direction
       has no reason to spend that work. */
    --stage-applied:   #0052cc;
    --stage-interview: #ff8b00;
    --stage-offer:     #36b37e;
    --stage-reject:    #de350b;

    --pair-a: #0052cc;                  /* CVD-safe diverging pair, skill charts */
    --pair-b: #d9730d;

    --warn: #974f0c;  --danger: #de350b;  --danger-bg: #ffebe6;  --pos: #216e4e;

    /* activity heatmap: sequential, single hue, light -> dark */
    --hm-0: #dfe3db; --hm-1: #74c0a1; --hm-2: #4a9f7f; --hm-3: #258260; --hm-4: #066a47;

    --focus: var(--ink);
    --shadow-card:   0 1px 2px rgb(22 25 28 / .10);
    --shadow-dialog: 0 12px 32px rgb(22 25 28 / .22);

    --font-display: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
                    Menlo, Consolas, "Liberation Mono", monospace;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --t-xs: 11px; --t-sm: 12px; --t-md: 13px;
    --t-lg: 15px; --t-xl: 18px; --t-2xl: 24px;

    --r-sm: 3px; --r-md: 6px; --r-pill: 999px;
  }

  /* Dark is a SELECTED palette, not an inversion of the light one. The stage four
     were re-stepped into the dark lightness band (OKLCH L .48-.67) and re-validated
     all-pairs: worst CVD dE 10.0 (deutan, offer<->interview) and normal-vision
     dE 20.5 — both clear the light set's bar of 9.2 / 18.2.
     The obvious lift fails: a salmon #ff7452 for reject collapses to dE 14.3
     against a lifted orange, because lightening a vermilion walks its hue toward
     interview. Keep reject a deep vermilion. Re-run validate_palette.js
     --mode dark --surface "#232723" --pairs all after any change here. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #171a17;  --sunk: #1e221e;  --surface: #232723;
    --ink: #e8ebe4;  --ink-2: #a3aca0;  --ink-3: #8d968a;
    --rule: #333a32;  --rule-strong: #4a5348;
    --stage-applied: #288cf8;  --stage-interview: #cc800c;
    --stage-offer:   #14ac74;  --stage-reject:    #b81400;
    --pair-a: #288cf8;  --pair-b: #cc800c;
    --warn: #e0a76a;  --danger: #ff7a66;  --danger-bg: #3a1c15;  --pos: #57d9a3;
    --hm-0: #1e221e; --hm-1: #397962; --hm-2: #5b9b82; --hm-3: #7bbba1; --hm-4: #9bdbc0;
    --shadow-card:   0 1px 2px rgb(0 0 0 / .40);
    --shadow-dialog: 0 12px 32px rgb(0 0 0 / .55);
  }

  * { box-sizing: border-box; }
  body { font-family: var(--font-ui); font-size: var(--t-md); margin: 0;
         background: var(--ground); color: var(--ink);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* One focus treatment for the whole app. Achromatic so it can never be mistaken
     for a stage color. Replaces the single .seg rule this file used to have. */
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  /* Applied for one frame while the theme flips. Two reasons: a theme switch has no
     business animating every element on the page, and Firefox will not commit a
     transitioned property whose value comes from a custom property that just changed
     — buttons and tabs keep their old colors until something else forces a restyle. */
  .theme-switching, .theme-switching * { transition: none !important; }

  /* --- buttons: two kinds, grouped by role rather than restyled per id --- */
  button { font: inherit; cursor: pointer; }
  #syncBtn, #addPanel > summary, #add button, #editForm button.save, #mktScan,
  #mktAddPanel > summary, #mktAddForm button[type=submit] {
    padding: 7px 14px; border: 1px solid var(--ink); border-radius: var(--r-sm);
    background: var(--ink); color: var(--ground);
    font-family: var(--font-display); font-size: var(--t-sm); letter-spacing: -.01em;
    transition: background-color .12s, color .12s, border-color .12s;
  }
  /* .mkt-actions button covers Check postings/alive/new; #mktScan outranks it and
     stays primary, since scanning is the action that tab exists for. */
  #authBtn, #themeBtn, #mktSave, #editForm button.cancel, .mkt-actions button, #mktFetch {
    padding: 7px 14px; border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
    background: transparent; color: var(--ink);
    font-family: var(--font-display); font-size: var(--t-sm); letter-spacing: -.01em;
    transition: background-color .12s, color .12s, border-color .12s;
  }
  #authBtn:hover, #themeBtn:hover, #mktSave:hover,
  #editForm button.cancel:hover, .mkt-actions button:hover, #mktFetch:hover { background: var(--sunk); }
  #syncBtn:hover, #addPanel > summary:hover, #add button:hover,
  #editForm button.save:hover, #mktScan:hover,
  #mktAddPanel > summary:hover, #mktAddForm button[type=submit]:hover { background: var(--ink-2); border-color: var(--ink-2); }
  #mktFetch:disabled { opacity: .5; cursor: progress; }
  button.job:disabled { opacity: .5; cursor: progress; }

  input, textarea, select {
    padding: 7px 9px; border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink); font: inherit;
  }
  input[type=date] { font-family: var(--font-display); font-size: var(--t-sm); }

  /* --- header: one row, ~52px. The wordmark is the display face's first outing. --- */
  header { display: flex; align-items: center; gap: 16px; padding: 0 20px; min-height: 52px;
           background: var(--surface); border-bottom: 1px solid var(--rule); }
  h1 { margin: 0; font-family: var(--font-display); font-size: var(--t-xl); font-weight: 500;
       letter-spacing: -.02em; text-transform: uppercase; white-space: nowrap; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 8px;
          font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; }
  #lastSynced { font-family: var(--font-display); color: var(--ink-3); margin-right: 4px; }

  /* The add form is a popover, not an inline row: the shell is fixed-height, so a
     disclosure that reflows the header pushes every view down by its own height.
     position:relative here keeps #addPanel the containing block (see the .seg note). */
  #addPanel { position: relative; }
  #addPanel > summary { display: inline-block; list-style: none; user-select: none; }
  #addPanel > summary::-webkit-details-marker { display: none; }
  #add { position: absolute; top: calc(100% + 8px); left: 0; z-index: 20;
         display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
         padding: 12px; background: var(--surface);
         border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow-dialog); }

  /* --- tabs --- */
  .tabs { display: flex; gap: 2px; padding: 0 20px; background: var(--surface);
          border-bottom: 1px solid var(--rule); }
  .tabs button { padding: 9px 12px; border: 0; border-bottom: 2px solid transparent;
                 background: transparent; color: var(--ink-2);
                 font-family: var(--font-display); font-size: var(--t-sm);
                 text-transform: uppercase; letter-spacing: .06em;
                 transition: color .12s, border-color .12s; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--ink); }
  .view { display: none; }
  .view.active { display: grid; }              /* board is a grid; other views override below */
  #timing.active, #heatmap.active, #flow.active, #market.active, #salary.active, #resume.active {
    display: block; flex: 1; min-height: 0; overflow: auto; padding: 24px 20px;
  }

  /* --- board filter row --- */
  /* Shown only on the Board tab. It can't ride .view/.view.active like the tab bodies
     do: it lives outside #board (render() wipes that element's innerHTML), so the
     :has() on the Board *button* is what scopes it. */
  #boardFilter { display: none; align-items: center; gap: 12px; padding: 10px 20px;
                 background: var(--surface); border-bottom: 1px solid var(--rule); }
  body:has(#tabBoard.active) #boardFilter { display: flex; }
  #boardFilter label { font-size: var(--t-sm); color: var(--ink-2); }
  #boardSearch { flex: 1; max-width: 360px; }
  #boardCount { font-family: var(--font-display); font-size: var(--t-sm); color: var(--ink-3); }

  /* --- board --- */
  /* No `display` here on purpose: .board and .view have equal specificity, so a
     display:grid on this rule would out-order .view{display:none} and the board would
     never hide when another tab is active. .view.active supplies the grid. */
  .board { flex: 1; min-height: 0; grid-template-columns: repeat(4, 1fr);
           gap: 12px; padding: 20px; }
  .column { background: var(--sunk); border-radius: var(--r-md); padding: 8px;
            display: flex; flex-direction: column; min-height: 0; }
  /* The one place hue appears on the board: a rule identifying the stage. */
  .column::before { content: ""; display: block; height: 2px; border-radius: 1px;
                    background: var(--stage, var(--rule-strong)); margin: 0 2px 8px; }
  .column[data-status="applied"]      { --stage: var(--stage-applied); }
  .column[data-status="interviewing"] { --stage: var(--stage-interview); }
  .column[data-status="offer"]        { --stage: var(--stage-offer); }
  .column[data-status="rejected"]     { --stage: var(--stage-reject); }
  .column h2 { margin: 0 4px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .col-name { font-family: var(--font-display); font-size: var(--t-xs); text-transform: uppercase;
              letter-spacing: .08em; color: var(--ink-2); font-weight: 400; }
  .col-n { font-family: var(--font-display); font-size: var(--t-lg); color: var(--ink);
           font-variant-numeric: tabular-nums; }
  .dropzone { flex: 1; min-height: 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .dropzone:empty::after { content: "—"; color: var(--ink-3); font-family: var(--font-display);
                           font-size: var(--t-sm); padding: 8px 6px; }
  .dropzone.over { outline: 2px dashed var(--ink-3); outline-offset: -2px; border-radius: var(--r-sm); }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md);
          padding: 10px 48px 10px 10px; box-shadow: var(--shadow-card); cursor: grab; position: relative;
          transition: border-color .12s, box-shadow .12s; }
  .card:hover { border-color: var(--rule-strong); }
  .card.dragging { opacity: .4; }
  .card .company { font-weight: 600; line-height: 1.3; }
  .card .title { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.35; margin-top: 1px; }
  .card .date { font-family: var(--font-display); font-size: var(--t-xs); color: var(--ink-3);
                margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .meta { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .card .del, .card .edit { position: absolute; top: 5px; width: 20px; height: 20px; border: 0;
                            background: transparent; color: var(--ink-3); line-height: 1;
                            border-radius: var(--r-sm); transition: color .12s, background-color .12s; }
  .card .del { right: 5px; font-size: var(--t-lg); }
  .card .edit { right: 27px; font-size: var(--t-md); }
  .card .del:hover { color: var(--danger); background: var(--sunk); }
  .card .edit:hover { color: var(--ink); background: var(--sunk); }
  .milestone { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--ink-2); }
  .milestone .ms-label { min-width: 58px; font-family: var(--font-display); text-transform: uppercase;
                         letter-spacing: .06em; color: var(--ink-3); }
  .milestone .ms-date { padding: 1px 3px; font-family: var(--font-display); font-size: var(--t-xs);
                        border: 1px solid var(--rule); border-radius: var(--r-sm); background: transparent; }
  .milestone .ms-days { margin-left: auto; font-family: var(--font-display); font-weight: 600;
                        color: var(--ink); font-variant-numeric: tabular-nums; }

  /* --- edit dialog --- */
  dialog { border: 1px solid var(--rule); border-radius: var(--r-md); padding: 20px;
           background: var(--surface); color: var(--ink); box-shadow: var(--shadow-dialog); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  #editForm { display: flex; flex-direction: column; gap: 10px; min-width: 280px; }
  #editForm h2 { margin: 0 0 2px; font-family: var(--font-display); font-size: var(--t-md);
                 font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  #editForm menu { display: flex; justify-content: flex-end; gap: 8px; margin: 4px 0 0; padding: 0; }
  #editMilestones { display: flex; flex-direction: column; gap: 8px; }
  .edit-ms { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); }
  .edit-ms .lbl { min-width: 64px; font-family: var(--font-display); text-transform: uppercase;
                  letter-spacing: .06em; font-size: var(--t-xs); color: var(--ink-2); }
  .edit-ms .val { flex: 1; }
  .edit-ms .clear { padding: 4px 10px; border: 0; border-radius: var(--r-sm);
                    background: var(--danger-bg); color: var(--danger);
                    font-family: var(--font-display); font-size: var(--t-xs); }
  .edit-ms .clear:hover { filter: brightness(.94); }

  /* --- activity heatmap --- */
  .hm-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px);
             grid-auto-columns: 12px; gap: 3px; }
  .hm-cell { width: 12px; height: 12px; border-radius: 2px; background: var(--hm-0); }
  .hm-cell.l1 { background: var(--hm-1); } .hm-cell.l2 { background: var(--hm-2); }
  .hm-cell.l3 { background: var(--hm-3); } .hm-cell.l4 { background: var(--hm-4); }
  .hm-cell.blank { background: transparent; }
  .hm-tip { position: fixed; z-index: 30; pointer-events: none; display: none;
            background: var(--ink); color: var(--ground); font-family: var(--font-display);
            font-size: var(--t-xs); padding: 4px 8px; border-radius: var(--r-sm);
            white-space: nowrap; transform: translate(-50%, -140%); }
  /* Month names sit on a 12px column grid; the display face is wider than that and
     ran adjacent labels into each other, so these keep the UI face. */
  .hm-months, .hm-days { font-family: var(--font-ui); color: var(--ink-3); }
  .hm-legend { font-family: var(--font-display); color: var(--ink-3); }
  .hm-months { display: grid; grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px;
               font-size: var(--t-xs); margin: 0 0 4px 30px; }
  .hm-row { display: flex; }
  .hm-days { display: grid; grid-template-rows: repeat(7, 12px); gap: 3px;
             font-size: 9px; margin-right: 6px; width: 24px; }
  .hm-days span { line-height: 12px; }
  .hm-legend { display: flex; align-items: center; gap: 4px; font-size: var(--t-xs); margin: 12px 0 0 30px; }
  .hm-legend .hm-cell { display: inline-block; }

  /* --- sankey flow --- */
  .sankey text { font-family: var(--font-display); font-size: var(--t-xs); fill: var(--ink); }
  .sankey .link { fill: none; stroke-opacity: .35; }
  .sankey .link:hover { stroke-opacity: .6; }

  /* --- timing --- */
  .tm-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
              gap: 12px; margin-bottom: 20px; }
  .tm-tile { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 12px 14px; }
  .tm-tile .lbl { font-size: var(--t-sm); color: var(--ink-2); }
  .tm-tile .val { font-family: var(--font-display); font-size: var(--t-2xl); font-weight: 500;
                  color: var(--ink); margin-top: 4px; letter-spacing: -.02em;
                  font-variant-numeric: tabular-nums; }
  .tm-tile .sub { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; }
  .tm-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md);
             padding: 16px; margin-bottom: 20px; }
  .tm-card h2 { margin: 0; font-size: var(--t-lg); font-weight: 600; color: var(--ink); }
  .tm-card .cap { margin: 3px 0 0; font-size: var(--t-sm); color: var(--ink-2); }
  .tm-card .plot { margin-top: 10px; }
  .tm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
             gap: 20px; margin-bottom: 20px; }
  .tm-grid .tm-card { margin-bottom: 0; }
  .tm-empty, .mkt-empty { color: var(--ink-2); font-size: var(--t-md); }
  .tm-empty { padding: 20px 2px; }
  .mkt-empty { padding: 12px 2px; }
  .tm-chart text { font-family: var(--font-display); font-size: var(--t-xs); fill: var(--ink-2); }
  .tm-chart .tick, .tm-chart .cap-val { font-variant-numeric: tabular-nums; }
  .tm-chart .cap-val { font-size: var(--t-xs); fill: var(--ink-3); }
  /* Row names are prose (job titles), not data, so they take the UI face — and mono
     here overran the label gutter the chart's PAD_L reserves, clipping longer titles. */
  .tm-chart .row-name { font-family: var(--font-ui); font-size: var(--t-sm);
                        fill: var(--ink); font-weight: 600; }
  .tm-chart .axis { stroke: var(--rule); stroke-width: 1; }
  .tm-key { display: flex; gap: 16px; font-family: var(--font-display); font-size: var(--t-xs);
            color: var(--ink-2); margin-top: 2px; }

  /* --- job search --- */
  .mkt-profile, .sal-card, .sal-filter { background: var(--surface); border: 1px solid var(--rule);
                                         border-radius: var(--r-md); margin-bottom: 20px; }
  .mkt-profile { padding: 16px; }
  .mkt-profile h2, .sal-card h2 { margin: 0 0 10px; font-size: var(--t-lg); font-weight: 600; }
  .mkt-fields { display: flex; gap: 20px; flex-wrap: wrap; }
  .mkt-fields label, .sal-filter label, .res-row label, .sal-skillbar label {
    display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); color: var(--ink-2); }
  .mkt-fields textarea { min-width: 240px; resize: vertical; }
  .mkt-fields fieldset, .sal-filter fieldset { border: 1px solid var(--rule-strong);
                                               border-radius: var(--r-sm); padding: 6px 12px; }
  .mkt-fields legend, .sal-filter legend { font-size: var(--t-sm); color: var(--ink-2); padding: 0 4px; }
  .mkt-fields fieldset label, .sal-filter fieldset label { flex-direction: row; align-items: center;
                                                           gap: 6px; color: var(--ink); }
  .mkt-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .mkt-info, .sal-info { font-family: var(--font-display); font-size: var(--t-sm); color: var(--ink-2); }
  .mkt-filter { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mkt-filter label { font-size: var(--t-sm); color: var(--ink-2); }
  .mkt-filter input { flex: 1; max-width: 360px; }
  /* Same popover idiom as the header's "+ Add job" (#addPanel/#add): a disclosure whose
     form is absolutely positioned, so opening it overlays the table instead of reflowing it. */
  #mktAddPanel { position: relative; }
  #mktAddPanel > summary { display: inline-block; list-style: none; user-select: none; }
  #mktAddPanel > summary::-webkit-details-marker { display: none; }
  #mktAddForm { position: absolute; top: calc(100% + 8px); left: 0; z-index: 20;
                display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                padding: 12px; background: var(--surface);
                border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow-dialog); }
  #mktAddForm input[name=url] { min-width: 280px; }

  /* One table style, shared by four unrelated tables — splitting it buys nothing
     until they actually diverge. */
  .mkt-table { width: 100%; border-collapse: collapse; background: var(--surface);
               border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
  .mkt-table th, .mkt-table td { text-align: left; padding: 8px 10px;
                                 border-bottom: 1px solid var(--rule); font-size: var(--t-md);
                                 vertical-align: top; }
  .mkt-table th { background: var(--sunk); color: var(--ink-2); font-family: var(--font-display);
                  text-transform: uppercase; letter-spacing: .06em; font-size: var(--t-xs); font-weight: 500; }
  .mkt-table th .sort { background: none; border: 0; padding: 0; font: inherit; color: inherit;
                        letter-spacing: inherit; text-transform: inherit; }
  .mkt-table th .sort::after { content: attr(data-arrow); font-size: 8px; padding-left: 5px; vertical-align: middle; }
  .mkt-table th .sort:hover { color: var(--ink); }
  .mkt-table tr:last-child td { border-bottom: 0; }
  .mkt-table tbody tr { transition: background-color .12s; }
  .mkt-table tbody tr:hover { background: var(--sunk); }
  .mkt-table .level { text-transform: capitalize; color: var(--ink-2); }
  .mkt-table .salary { white-space: nowrap; font-family: var(--font-display); font-size: var(--t-sm); }
  .mkt-table .yrs { text-align: right; color: var(--ink-2); font-family: var(--font-display); }
  .mkt-table td.num, .mkt-table th.num { text-align: right; font-family: var(--font-display);
                                         font-variant-numeric: tabular-nums; }
  .mkt-table a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-strong);
                 text-underline-offset: 2px; }
  .mkt-table a:hover { text-decoration-color: currentColor; }
  .mkt-table .url a { display: block; max-width: 360px; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; font-family: var(--font-display); font-size: var(--t-sm); }
  .mkt-table .del { border: 0; background: transparent; color: var(--ink-3); font-size: var(--t-lg);
                    line-height: 1; border-radius: var(--r-sm); padding: 0 6px; }
  .mkt-table .del:hover { color: var(--danger); background: var(--sunk); }
  .mkt-table .score { font-family: var(--font-display); font-variant-numeric: tabular-nums;
                      font-weight: 600; color: var(--ink); white-space: nowrap; }

  /* --- salary --- */
  .sal-filter { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 14px 16px; }
  .sal-filter input[type=search] { min-width: 220px; }
  .sal-filter fieldset { display: flex; gap: 12px; }
  .sal-filter fieldset label { text-transform: capitalize; }
  .sal-info { margin-left: auto; align-self: center; }
  .sal-card { padding: 16px; }
  .sal-card .mkt-table { margin-bottom: 14px; }
  /* sequential: rarer = muted ink, more frequent = darker and bigger */
  .skill-cloud { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
                 text-align: center; gap: 2px 14px; line-height: 1.15; max-width: 760px; margin: 0 auto 14px; }
  .skill-cloud span { color: var(--ink-2); white-space: nowrap; }
  .sal-skillbar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .sal-skillbar select { min-width: 220px; }

  /* --- resume analysis --- */
  .res-text { width: 100%; min-height: 200px; padding: 10px; resize: vertical;
              font: var(--t-sm)/1.5 var(--font-display); }
  .res-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .res-row input[type=number] { width: 80px; }
  .res-row input[type=file] { font-size: var(--t-sm); }
  .res-note { font-size: var(--t-sm); color: var(--ink-2); }
  .res-note.warn { color: var(--warn); }
  .res-note.err { color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips span { font-family: var(--font-display); font-size: var(--t-xs); background: var(--sunk);
                border: 1px solid var(--rule); border-radius: var(--r-pill); padding: 2px 9px; color: var(--ink); }
  .chips span.lack { background: transparent; border-color: var(--warn); color: var(--warn); }
  .chips span.chips-label { border: 0; background: transparent; padding-left: 0; }
  .chip-x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer;
            font: inherit; line-height: 1; padding: 0 0 0 6px; }
  .chip-x:hover { color: var(--danger); }
  #resume [inert] { opacity: .5; }
  /* one Off/Low/Normal/High segmented control per scoring feature. Radios, not a slider:
     the score is a *normalized* weighted average, so only the ratios between features
     mean anything — a 0-100 readout invited people to read absolute importance into it. */
  /* Flex, not grid: a grid track sized minmax(Npx, 1fr) stays Npx wide even when the
     control needs more, so the last column ran off the card edge at larger font sizes.
     A flex item won't shrink below its own min-content — it wraps to the next line. */
  .res-weights { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-bottom: 8px; }
  /* Rows size to their content, so the label always sits one fixed gap from its control.
     The em-based label column keeps them aligned into columns at any font size. */
  .res-weights .wrow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px;
                       font-size: var(--t-sm); color: var(--ink-2); }
  .res-weights .wname { flex: none; min-width: 5.5em; }
  .seg { display: flex; flex: none; border: 1px solid var(--rule-strong); border-radius: var(--r-sm);
         overflow: hidden; background: var(--surface); }
  /* Zero-sized but still IN FLOW. Hiding these with position:absolute made the body their
     containing block, so focusing one on click scrolled the window instead of #resume and
     slid the whole fixed-height layout off screen. */
  .seg input { appearance: none; width: 0; height: 0; margin: 0; padding: 0; border: 0; }
  .seg label { padding: 3px 9px; font-family: var(--font-display); font-size: var(--t-xs);
               color: var(--ink-2); cursor: pointer; border-left: 1px solid var(--rule);
               user-select: none; transition: background-color .12s, color .12s; }
  .seg label:first-of-type { border-left: 0; }
  .seg input:checked + label { background: var(--ink); color: var(--ground); border-left-color: var(--ink); }
  .seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: -2px; }
  .delta { font-family: var(--font-display); font-size: var(--t-xs); font-weight: 600; margin-left: 5px; }
  .delta.up { color: var(--pos); }
  .delta.down { color: var(--ink-3); }
  .res-toggles { display: flex; gap: 18px; flex-wrap: wrap; font-size: var(--t-sm);
                 color: var(--ink); margin-bottom: 12px; }
  .res-toggles label { display: flex; align-items: center; gap: 6px; }
  .feat { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: var(--t-xs); color: var(--ink-2); }
  .feat b { font-family: var(--font-display); font-weight: 600; color: var(--ink);
            font-variant-numeric: tabular-nums; }
  .feat .off { color: var(--ink-3); }

  /* --- responsive: the viewport meta was here from the start, the breakpoints weren't --- */
  @media (max-width: 900px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; overflow-y: auto; }
    header { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
    .sync { width: 100%; margin-left: 0; justify-content: flex-start; flex-wrap: wrap; }
    .tabs { overflow-x: auto; padding: 0 12px; }
    .tabs button { white-space: nowrap; }
    #timing.active, #heatmap.active, #flow.active,
    #market.active, #salary.active, #resume.active { padding: 16px 12px; }
  }
</style>
<script>
  /* Set the theme before first paint so a dark reload never flashes light.
     JS owns the attribute in both directions, which is why there's no
     prefers-color-scheme block above — one source of truth, no duplicated tokens. */
  document.documentElement.dataset.theme = localStorage.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
</head>
<body>

<script>
const COLUMNS = [
  ["applied", "Applied"],
  ["interviewing", "Interviewing"],
  ["offer", "Offer"],
  ["rejected", "Rejected"],
];

const MILESTONES = [
  ["interview_date", "Interview"],
  ["offer_date", "Offer"],
  ["rejected_date", "Rejected"],
];

// Series colors, shared by the Flow and Timing tabs so a stage keeps one hue app-wide.
// These resolve through CSS custom properties rather than holding hex: every chart here
// is inline SVG in the live DOM, so var() works in fill=/stroke= presentation attributes.
// That means light and dark come from one source of truth in :root, and no chart function
// has to know which theme is active. The hex values, and the CVD reasoning behind both
// sets, live next to the tokens in the <style> block above.
const C_APPLIED   = "var(--stage-applied)";
const C_INTERVIEW = "var(--stage-interview)";
const C_OFFER     = "var(--stage-offer)";
const C_REJECT    = "var(--stage-reject)";

/**
 * Whole days between two dates.
 * @param {string} from - a YYYY-MM-DD date.
 * @param {string} to - a YYYY-MM-DD date.
 * @returns {number} the difference, rounded; negative if `to` precedes `from`.
 */
const elapsedDays = (from, to) =>
  Math.round((new Date(to) - new Date(from)) / 86400000);

/**
 * Today's local date, formatted the way the server stamps dates.
 * @returns {string} YYYY-MM-DD — en-CA formats that way.
 */
const todayISO = () => new Date().toLocaleDateString("en-CA");

/**
 * One JSON call to the app's own API.
 * @param {string} method - the HTTP method.
 * @param {string} path - the endpoint, e.g. "/api/jobs".
 * @param {object} [body] - sent as JSON; omit for a request with no body.
 * @returns {Promise<any>} the parsed response.
 * @throws {Error} carrying the server's `error` field, or the status text, on any
 *   non-2xx response.
 */
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

// --- long jobs -------------------------------------------------------------
// A scan/check/sync runs on its own thread server-side and writes the same
// databases, so the server allows only one at a time (409 otherwise) and the UI
// disables every job button while one runs. The flag lives out here because
// switching tabs re-renders a view and rebuilds its buttons from scratch —
// paintBusy() puts the running state back on the new nodes, so the UI matches
// the run that is still in flight.
let busy = null;                  // { id, label, elapsed } of the running job's button

/**
 * Start a background job on the server and poll until it finishes.
 *
 * The POST returns 202 straight away, so nothing sits on an open connection waiting
 * for a multi-minute run. Polling is a fixed 1s tick that reports elapsed seconds
 * only — real progress lives in tqdm on the app's terminal, and surfacing it here
 * would mean capturing the subprocess's stdout.
 *
 * @param {string} method - the HTTP method for the kick-off request.
 * @param {string} path - the endpoint that starts the job.
 * @param {object} [body] - the kick-off request's body.
 * @returns {Promise<any>} the finished job's result.
 * @throws {Error} if the kick-off is refused (409 when a job is already running, 400
 *   on a bad request) or if the job itself fails.
 */
async function runRemote(method, path, body) {
  await api(method, path, body);
  for (;;) {
    await new Promise(r => setTimeout(r, 1000));
    const s = await api("GET", "/api/job");
    if (s.done) {
      if (s.error) throw new Error(s.error);
      return s.result;
    }
    if (busy) { busy.elapsed = s.elapsed; paintBusy(); }
  }
}

/**
 * Format a running total for the button label.
 * @param {number} sec - elapsed seconds.
 * @returns {string} "8s" under a minute, "1m 20s" past it.
 */
function fmtElapsed(sec) {
  const s = Math.round(sec || 0);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
}

/**
 * Push the current `busy` state onto whatever nodes are in the DOM right now.
 *
 * Called after every render as well as on each poll, because a re-render rebuilds
 * the buttons from scratch and they come back enabled. Controls marked
 * [data-job-lock] go `inert` for the duration — edits there would be overwritten by
 * a run that rewrites the same column. They are locked during any job, not only the
 * one that touches them.
 *
 * @returns {void} disables every .job button, inerts every locked control, and
 *   writes the running label and elapsed time onto the button that started the job.
 */
function paintBusy() {
  for (const b of document.querySelectorAll("button.job")) b.disabled = !!busy;
  for (const el of document.querySelectorAll("[data-job-lock]")) el.inert = !!busy;
  const b = busy && document.getElementById(busy.id);
  if (b) b.textContent = busy.elapsed ? `${busy.label} ${fmtElapsed(busy.elapsed)}` : busy.label;
}

/**
 * Run an async action with the whole UI in its busy state.
 * @param {HTMLElement} btn - the button that started it; its id identifies it across
 *   re-renders, and its text is restored afterwards.
 * @param {string} label - what to show on the button while it runs.
 * @param {() => Promise<any>} fn - the work.
 * @returns {Promise<any>} fn's result. The busy state is always cleared, even if fn
 *   throws, and the idle label is put back on the live node — fn may have re-rendered
 *   the original away.
 */
async function runJob(btn, label, fn) {
  const idle = btn.textContent;
  busy = { id: btn.id, label, elapsed: 0 };
  paintBusy();
  try {
    return await fn();
  } finally {
    busy = null;
    paintBusy();
    const now = document.getElementById(btn.id);
    if (now) now.textContent = idle;
  }
}

/**
 * Build one draggable application card.
 * @param {object} job - a row from /api/jobs.
 * @returns {HTMLElement} the card, wired up: the milestone date inputs PATCH on
 *   change (reverting on failure), the × deletes the job, the ✎ opens the edit
 *   dialog, and dragstart/dragend carry the id for the board's drop zones.
 */
function cardEl(job) {
  const el = document.createElement("div");
  el.className = "card";
  el.draggable = true;
  el.dataset.id = job.id;
  el.innerHTML = `<button class="edit" title="Edit" aria-label="Edit">&#9998;</button>
    <button class="del" title="Delete" aria-label="Delete">&times;</button>
    <div class="company"></div><div class="title"></div><div class="date"></div>
    <div class="meta"></div>`;
  el.querySelector(".company").textContent = job.company;
  el.querySelector(".title").textContent = job.title;
  const dateEl = el.querySelector(".date");
  dateEl.textContent = job.applied_date;
  if (job.status === "applied")
    dateEl.textContent += ` · ${elapsedDays(job.applied_date, todayISO())}d ago`;

  const meta = el.querySelector(".meta");
  for (const [field, label] of MILESTONES) {
    if (!job[field]) continue;
    const row = document.createElement("label");
    row.className = "milestone";
    row.innerHTML = `<span class="ms-label"></span><input type="date" class="ms-date"><span class="ms-days"></span>`;
    row.querySelector(".ms-label").textContent = label;
    const input = row.querySelector(".ms-date");
    const days = row.querySelector(".ms-days");
    input.value = job[field];
    // days from application to this milestone, blank when the date is cleared
    const showDays = () => days.textContent = input.value ? elapsedDays(job.applied_date, input.value) + "d" : "";
    showDays();
    input.addEventListener("change", async () => {
      try {
        await api("PATCH", `/api/jobs/${job.id}`, { [field]: input.value });
        job[field] = input.value;
        showDays();
      } catch (err) {
        alert("Could not update date: " + err.message);
        input.value = job[field];  // revert on failure
        showDays();
      }
    });
    meta.appendChild(row);
  }
  el.querySelector(".del").onclick = async () => {
    await api("DELETE", `/api/jobs/${job.id}`);
    el.remove();  // :empty CSS restores the placeholder if the column empties
  };
  el.querySelector(".edit").onclick = () => openEdit(job);
  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", job.id);
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  return el;
}

/**
 * Draw the kanban board: one column per status, filled with cards.
 * @param {object[]} jobs - every row from /api/jobs.
 * @returns {void} replaces #board's contents. Each column is a drop zone: a drop
 *   moves the card optimistically, PATCHes the new status, then reloads so the
 *   server-stamped milestone date shows — and reloads on failure too, to resync.
 */
function render(jobs) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  // Filtering here rather than at the call sites means the filter survives every
  // redraw: load(), the drag-drop refresh and a milestone edit all come back through
  // render() and re-read the box.
  const shown = jobs.filter(boardFilter(document.getElementById("boardSearch").value));
  const count = document.getElementById("boardCount");
  count.textContent = shown.length === jobs.length ? "" : `${shown.length} of ${jobs.length} shown`;
  for (const [status, label] of COLUMNS) {
    const col = document.createElement("section");
    col.className = "column";
    col.dataset.status = status;                  // picks the stage hue for the column rule
    col.innerHTML = `<h2><span class="col-name"></span><span class="col-n"></span></h2><div class="dropzone"></div>`;
    const inColumn = shown.filter(j => j.status === status);
    col.querySelector(".col-name").textContent = label;
    col.querySelector(".col-n").textContent = inColumn.length;
    const zone = col.querySelector(".dropzone");
    inColumn.forEach(j => zone.appendChild(cardEl(j)));

    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("over"));
    zone.addEventListener("drop", async e => {
      e.preventDefault();
      zone.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card || card.parentElement === zone) return;
      zone.appendChild(card);                       // optimistic move
      try {
        await api("PATCH", `/api/jobs/${id}`, { status });
        load();                                     // refresh to show the stamped milestone date
      } catch (err) {
        alert("Could not move card: " + err.message);
        load();                                     // resync from server on failure
      }
    });
    board.appendChild(col);
  }
}

let allJobs = [];

/**
 * Fetch every application and redraw whatever is on screen.
 * @returns {Promise<void>} refreshes the module-level allJobs, redraws the board,
 *   and re-renders whichever other view is currently active.
 */
async function load() {
  allJobs = await api("GET", "/api/jobs");
  render(allJobs);
  for (const v of Object.values(VIEWS))
    if (document.getElementById(v.el).classList.contains("active")) v.render();
}

// ponytail: no debounce — filtering a few hundred cards in memory is well under a
// frame, and a debounce would only add lag you can feel while typing.
document.getElementById("boardSearch").addEventListener("input", () => render(allJobs));

// --- activity heatmap (GitHub-style, last ~53 weeks, computed client-side) ---
const HM_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const hmTip = document.body.appendChild(Object.assign(document.createElement("div"), { className: "hm-tip" }));

/**
 * Draw the activity heatmap: applications per day over the last 53 weeks.
 * @param {object[]} jobs - every row from /api/jobs; only applied_date is read.
 * @returns {void} replaces #heatmap with the month labels, the day grid, a legend
 *   and a total. Cells carry their own tooltip text and share one mousemove
 *   handler, because the native `title` tooltip has a ~1s delay.
 */
function renderHeatmap(jobs) {
  const counts = new Map();                       // YYYY-MM-DD -> applications that day
  for (const j of jobs)
    if (j.applied_date) counts.set(j.applied_date, (counts.get(j.applied_date) || 0) + 1);

  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const iso = dt => dt.toLocaleDateString("en-CA");
  const today = parse(todayISO());
  const start = new Date(today);                  // Sunday of today's week, 52 weeks back -> 53 columns
  start.setDate(start.getDate() - start.getDay() - 52 * 7);

  const grid = document.createElement("div");
  grid.className = "hm-grid";
  const months = document.createElement("div");
  months.className = "hm-months";
  let prevMonth = -1, total = 0;

  for (let col = 0; col <= 52; col++) {
    const colDate = new Date(start);
    colDate.setDate(start.getDate() + col * 7);
    const lbl = document.createElement("span");
    lbl.textContent = colDate.getMonth() !== prevMonth ? HM_MONTHS[colDate.getMonth()] : "";
    prevMonth = colDate.getMonth();
    months.appendChild(lbl);

    for (let row = 0; row < 7; row++) {
      const d = new Date(start);
      d.setDate(start.getDate() + col * 7 + row);
      const cell = document.createElement("div");
      if (d > today) { cell.className = "hm-cell blank"; grid.appendChild(cell); continue; }
      const key = iso(d), n = counts.get(key) || 0;
      total += n;
      cell.className = "hm-cell" + (n ? " l" + Math.min(n, 4) : "");
      cell.dataset.tip = `${n} application${n === 1 ? "" : "s"} on ${key}`;
      grid.appendChild(cell);
    }
  }

  grid.addEventListener("mousemove", e => {                 // instant tooltip (native title has a ~1s delay)
    const c = e.target.closest(".hm-cell");
    if (!c || !c.dataset.tip) { hmTip.style.display = "none"; return; }
    hmTip.textContent = c.dataset.tip;
    hmTip.style.left = e.clientX + "px";
    hmTip.style.top = e.clientY + "px";
    hmTip.style.display = "block";
  });
  grid.addEventListener("mouseleave", () => hmTip.style.display = "none");

  const days = document.createElement("div");
  days.className = "hm-days";
  for (const t of ["", "Mon", "", "Wed", "", "Fri", ""]) {
    const s = document.createElement("span"); s.textContent = t; days.appendChild(s);
  }
  const rowWrap = document.createElement("div");
  rowWrap.className = "hm-row";
  rowWrap.append(days, grid);

  const legend = document.createElement("div");
  legend.className = "hm-legend";
  legend.append("Less");
  for (const c of ["", "l1", "l2", "l3", "l4"]) {
    const sw = document.createElement("span"); sw.className = "hm-cell " + c; legend.appendChild(sw);
  }
  legend.append("More");

  const heading = document.createElement("p");
  heading.style.cssText = "font-family:var(--font-display);font-size:12px;color:var(--ink-2);margin:0 0 12px 30px;";
  heading.textContent = `${total} application${total === 1 ? "" : "s"} in the last year`;

  const root = document.getElementById("heatmap");
  root.innerHTML = "";
  root.append(heading, months, rowWrap, legend);
}

// --- application funnel (Sankey, hand-rolled SVG, computed client-side) ---
const FLOW_NODES = [
  { id: "applied",      label: "Applied",      col: 0, color: C_APPLIED },
  { id: "interviewing", label: "Interviewing", col: 1, color: C_INTERVIEW },
  { id: "awaiting",     label: "Awaiting",     col: 1, color: "var(--ink-2)" },
  { id: "ghosted",      label: "Ghosted",      col: 1, color: "var(--ink-3)" },
  { id: "offer",        label: "Offer",        col: 2, color: C_OFFER },
  { id: "rejected",     label: "Rejected",     col: 3, color: C_REJECT },
];
const GHOST_DAYS = 30;   // no reply after this long counts as ghosted

/**
 * Reconstruct each job's path through the funnel from its milestone dates.
 * @param {object[]} jobs - every row from /api/jobs.
 * @param {Date} today - the reference date, for ageing the still-open ones.
 * @returns {{from: string, to: string, value: number}[]} one link per distinct
 *   from→to pair, with `value` counting the jobs that took it. Exactly one edge
 *   leaves "applied" per job; a job still sitting at applied goes to "awaiting" or,
 *   past GHOST_DAYS, to "ghosted". Jobs actively interviewing or holding an offer
 *   rest at their node with no outgoing edge.
 */
function computeFlows(jobs, today) {
  const links = {};
  const add = (f, t) => links[f + "|" + t] = (links[f + "|" + t] || 0) + 1;
  for (const j of jobs) {
    const hi = !!j.interview_date, ho = !!j.offer_date, hr = !!j.rejected_date;
    if (hi) add("applied", "interviewing");          // out of applied: exactly one edge
    else if (ho) add("applied", "offer");            // offer without a recorded interview
    else if (hr) add("applied", "rejected");         // rejected straight from applied
    else if (j.status === "applied") {
      const [y, m, d] = j.applied_date.split("-").map(Number);
      const age = Math.floor((today - new Date(y, m - 1, d)) / 86400000);
      add("applied", age >= GHOST_DAYS ? "ghosted" : "awaiting");
    }
    if (hi) { if (ho) add("interviewing", "offer"); else if (hr) add("interviewing", "rejected"); }
    if (ho && hr) add("offer", "rejected");          // active interviewing/offer rest at their node
  }
  return Object.entries(links).map(([k, value]) => {
    const [from, to] = k.split("|"); return { from, to, value };
  });
}

/**
 * Draw the application funnel as a hand-rolled Sankey diagram.
 * @param {object[]} jobs - every row from /api/jobs.
 * @returns {void} replaces #flow with the SVG, or with an empty-state line when
 *   there are no applications. Nodes are scaled so the busiest column fills the
 *   height, then stacked and centred; links are drawn first so the nodes sit on top,
 *   and stacked in node order to limit crossings.
 */
function renderFlow(jobs) {
  const root = document.getElementById("flow");
  const [y, m, d] = todayISO().split("-").map(Number);
  const links = computeFlows(jobs, new Date(y, m - 1, d));
  if (!links.length) { root.innerHTML = `<p style="color:var(--ink-2)">No applications yet.</p>`; return; }

  const inflow = {}, outflow = {};
  for (const l of links) {
    outflow[l.from] = (outflow[l.from] || 0) + l.value;
    inflow[l.to] = (inflow[l.to] || 0) + l.value;
  }
  const nodes = {};
  for (const def of FLOW_NODES) {
    const value = Math.max(inflow[def.id] || 0, outflow[def.id] || 0);
    if (value) nodes[def.id] = { ...def, value };
  }
  const present = Object.values(nodes);
  const lastCol = Math.max(...present.map(n => n.col));

  const W = Math.max(640, root.clientWidth - 40), H = 440, NODE_W = 14, GAP = 16;
  const colX = c => 10 + c * ((W - 20 - NODE_W) / 3);

  // scale so the busiest column fills the height, then stack & center each column
  const cols = {};
  for (const n of present) (cols[n.col] ||= []).push(n);
  const ppu = Math.min(...Object.values(cols).map(
    ns => (H - (ns.length - 1) * GAP) / ns.reduce((s, n) => s + n.value, 0)));
  for (const ns of Object.values(cols)) {
    const block = ns.reduce((s, n) => s + n.value * ppu, 0) + (ns.length - 1) * GAP;
    let yy = Math.max(10, (H - block) / 2);
    for (const n of ns) {
      n.x = colX(n.col); n.h = n.value * ppu; n.y = yy;
      n.sCur = yy; n.tCur = yy;                     // source/target stacking cursors
      yy += n.h + GAP;
    }
  }

  let svg = `<svg class="sankey" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  // links first so nodes sit on top; stack by node order to limit crossings
  for (const def of FLOW_NODES) {
    if (!nodes[def.id]) continue;
    for (const l of links.filter(l => l.from === def.id)) {
      const s = nodes[l.from], t = nodes[l.to], th = l.value * ppu;
      const y0 = s.sCur + th / 2, y1 = t.tCur + th / 2;
      s.sCur += th; t.tCur += th;
      const x0 = s.x + NODE_W, x1 = t.x, xm = (x0 + x1) / 2;
      svg += `<path class="link" d="M${x0},${y0} C${xm},${y0} ${xm},${y1} ${x1},${y1}" `
           + `stroke="${s.color}" stroke-width="${Math.max(1, th)}">`
           + `<title>${s.label} → ${t.label}: ${l.value}</title></path>`;
    }
  }
  for (const n of present) {
    svg += `<rect x="${n.x}" y="${n.y}" width="${NODE_W}" height="${n.h}" rx="2" fill="${n.color}">`
         + `<title>${n.label}: ${n.value}</title></rect>`;
    const left = n.col === lastCol;
    svg += `<text x="${left ? n.x - 6 : n.x + NODE_W + 6}" y="${n.y + n.h / 2}" `
         + `text-anchor="${left ? "end" : "start"}" dominant-baseline="middle">${n.label} (${n.value})</text>`;
  }
  svg += `</svg>`;
  root.innerHTML = svg;
}

// --- timing (stage durations, hand-rolled SVG, computed client-side) ---
/**
 * Arithmetic mean.
 * @param {number[]} xs
 * @returns {number} the mean, or NaN for an empty list.
 */
const mean = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : NaN;

/**
 * Median, averaging the middle pair at even length.
 * @param {number[]} xs - not mutated; a copy is sorted.
 * @returns {number} the median, or NaN for an empty list.
 */
const median = xs => {
  if (!xs.length) return NaN;
  const s = [...xs].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/**
 * Days from applied_date to a milestone, across the jobs that reached it.
 *
 * Milestone dates are freely user-editable (card inputs and the edit dialog), so a
 * milestone before applied_date is reachable — those are dropped rather than drawn
 * as a bar at -40 days.
 *
 * @param {object[]} jobs - every row from /api/jobs.
 * @param {string} endField - the milestone column, e.g. "interview_date".
 * @param {(j: object) => boolean} [extra] - a further filter on which jobs count.
 * @returns {number[]} the spans in days, all finite and >= 0.
 */
const durations = (jobs, endField, extra = () => true) =>
  jobs.filter(j => j[endField] && extra(j))
      .map(j => elapsedDays(j.applied_date, j[endField]))
      .filter(d => Number.isFinite(d) && d >= 0);

/**
 * Is this application still open — applied, and never moved anywhere?
 * @param {object} j - a job row.
 * @returns {boolean} true when its status is still "applied" and it carries no
 *   milestone date at all.
 */
const isOpen = j => j.status === "applied"
  && !j.interview_date && !j.offer_date && !j.rejected_date;

/**
 * How long each still-open application has been waiting.
 *
 * These ages keep growing, so they are lower bounds on a wait, not the length of a
 * finished one — don't read them as outcomes.
 *
 * @param {object[]} jobs - every row from /api/jobs.
 * @param {string} today - the reference date as YYYY-MM-DD.
 * @returns {number[]} the ages in days, all finite and >= 0 (so a future-dated
 *   application drops out).
 */
const openAges = (jobs, today) => jobs.filter(isOpen)
  .map(j => elapsedDays(j.applied_date, today))
  .filter(d => Number.isFinite(d) && d >= 0);

/**
 * Pick a histogram bin width.
 * @param {number} max - the largest value to be binned.
 * @returns {number} 7 days, doubling until there would be at most 20 bins.
 */
const binWidth = max => { let w = 7; while (max / w > 20) w *= 2; return w; };

/**
 * Bin a list of day-counts for the histogram.
 * @param {number[]} values - must be non-empty.
 * @returns {{w: number, counts: number[]}} the chosen bin width and the count in
 *   each bin. A value sitting exactly on a bin edge lands in the upper bin.
 */
function histogramBins(values) {
  const max = Math.max(...values);
  const w = binWidth(max);
  const counts = new Array(Math.floor(max / w) + 1).fill(0);
  for (const v of values) counts[Math.floor(v / w)]++;
  return { w, counts };
}

/**
 * A round-looking axis tick interval.
 * @param {number} max - the axis maximum.
 * @param {number} [target] - roughly how many ticks are wanted.
 * @returns {number} the smallest of 1/2/2.5/5/10 x a power of ten that is no finer
 *   than max/target.
 */
const niceStep = (max, target = 6) => {
  const raw = Math.max(1, max / target), p = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
};

/**
 * SVG path for one histogram bar: 4px rounded at the data end, square at the baseline.
 * @param {number} x - left edge.
 * @param {number} y - top of the bar.
 * @param {number} w - bar width.
 * @param {number} h - bar height.
 * @returns {string} the `d` attribute.
 */
const barPath = (x, y, w, h) => {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h} V${y + r} a${r},${r} 0 0 1 ${r},${-r} h${w - 2 * r} `
       + `a${r},${r} 0 0 1 ${r},${r} V${y + h} Z`;
};

/**
 * Escape text for interpolation into markup.
 *
 * Quotes included: scraped titles and locations get interpolated into attributes
 * (option values, SVG <title>), where escaping only &<> leaves the attribute breakable.
 *
 * @param {*} s - anything; coerced to a string.
 * @returns {string} with & < > " ' replaced by entities.
 */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/**
 * "1 application" / "3 applications".
 * @param {number} n - the count.
 * @param {string} w - the singular noun.
 * @returns {string} the count and the noun, pluralised with a bare "s".
 */
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/**
 * A histogram of day-counts, as inline SVG.
 * @param {number[]} values - the spans in days.
 * @param {string} color - a CSS color for the bars, usually a stage token.
 * @param {number} width - the measured container width in px.
 * @returns {string} the SVG markup, or an empty-state paragraph when there is no
 *   data. Ticks sit on bin *edges*, not bar centres: a bar spans a range, it isn't
 *   a point.
 */
function histogramSVG(values, color, width) {
  if (!values.length) return `<p class="tm-empty">No data yet.</p>`;
  const { w, counts } = histogramBins(values);
  const W = Math.max(300, width), PLOT = 170, PAD_L = 14, PAD_R = 14, AXIS = 34;
  const H = PLOT + AXIS;                        // container includes the axis band
  const inner = W - PAD_L - PAD_R;
  const band = inner / counts.length;
  const barW = Math.min(24, band - 2);          // 2px surface gap between adjacent bars
  const maxCount = Math.max(...counts);

  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  counts.forEach((c, i) => {
    if (!c) return;
    const x = PAD_L + i * band + (band - barW) / 2;
    const h = Math.max(2, (c / maxCount) * (PLOT - 22));
    const y = PLOT - h;
    svg += `<path d="${barPath(x, y, barW, h)}" fill="${color}">`
         + `<title>${i * w}–${(i + 1) * w - 1} days: ${plural(c, "application")}</title></path>`
         + `<text class="cap-val" x="${x + barW / 2}" y="${y - 6}" text-anchor="middle">${c}</text>`;
  });
  const step = Math.max(1, Math.ceil(counts.length / 8));
  for (let i = 0; i <= counts.length; i += step)
    svg += `<text class="tick" x="${PAD_L + i * band}" y="${PLOT + 15}" text-anchor="middle">${i * w}</text>`;
  svg += `<line class="axis" x1="${PAD_L}" y1="${PLOT}" x2="${W - PAD_R}" y2="${PLOT}"/>`
       + `<text x="${W / 2}" y="${H - 4}" text-anchor="middle">days since application</text></svg>`;
  return svg;
}

/**
 * One row per series: an observed range with mean and median markers, as inline SVG.
 *
 * Every row shares one x-axis — that comparability is the whole point of this chart,
 * so never give the rows separate scales. The rule spans the observed min-max, not an
 * interval estimate; swap in an IQR box or a bootstrap CI once n is big enough for
 * either to mean anything.
 *
 * @param {{label: string, color: string, values: number[], open?: boolean}[]} series -
 *   one entry per row. `open` caps the rule with an arrow instead of a rounded end,
 *   for a series whose waits are still growing.
 * @param {number} width - the measured container width in px.
 * @returns {string} the SVG markup, or an empty-state paragraph when no series has
 *   any values.
 */
function rangeChartSVG(series, width) {
  const live = series.filter(s => s.values.length);
  if (!live.length) return `<p class="tm-empty">No data yet.</p>`;
  const maxAll = Math.max(...live.flatMap(s => s.values));
  const W = Math.max(360, width), PAD_L = 10, PAD_R = 22, TOP = 8, ROW = 56, AXIS = 34;
  const H = TOP + series.length * ROW + AXIS;
  const x0 = PAD_L, x1 = W - PAD_R;
  const sx = v => x0 + (maxAll ? (v / maxAll) : 0) * (x1 - x0);

  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  series.forEach((s, i) => {
    const yLabel = TOP + i * ROW + 12, y = TOP + i * ROW + 36;
    const n = s.values.length;
    svg += `<circle cx="${x0 + 4}" cy="${yLabel - 4}" r="4" fill="${s.color}"/>`
         + `<text class="row-name" x="${x0 + 15}" y="${yLabel}">${esc(s.label)}</text>`;
    if (!n) {
      svg += `<text x="${x0 + 15 + s.label.length * 7.2}" y="${yLabel}">  no data yet</text>`;
      return;
    }
    const lo = Math.min(...s.values), hi = Math.max(...s.values);
    const mu = mean(s.values), md = median(s.values);
    svg += `<text x="${x1}" y="${yLabel}" text-anchor="end" class="tick">`
         + `n=${n} · mean ${mu.toFixed(1)}d · median ${md}d</text>`;
    // observed range
    svg += `<line x1="${sx(lo)}" y1="${y}" x2="${sx(hi)}" y2="${y}" stroke="${s.color}" `
         + `stroke-width="3" stroke-linecap="round" stroke-opacity=".3">`
         + `<title>${esc(s.label)}: ${lo}–${hi} days (n=${n})</title></line>`;
    // an open series has no upper bound yet — cap it with an arrow, not a rounded end
    if (s.open)
      svg += `<path d="M${sx(hi)},${y - 5} L${sx(hi) + 9},${y} L${sx(hi)},${y + 5} Z" fill="${s.color}" `
           + `fill-opacity=".5"><title>still open — these waits are still growing</title></path>`;
    // median: 2px tick, surface ring underneath so it stays legible where it meets the mean dot
    svg += `<line x1="${sx(md)}" y1="${y - 10}" x2="${sx(md)}" y2="${y + 10}" stroke="var(--surface)" stroke-width="6"/>`
         + `<line x1="${sx(md)}" y1="${y - 10}" x2="${sx(md)}" y2="${y + 10}" stroke="${s.color}" stroke-width="2">`
         + `<title>median ${md} days</title></line>`;
    // mean: >=8px marker with a 2px surface ring
    svg += `<circle cx="${sx(mu)}" cy="${y}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2">`
         + `<title>mean ${mu.toFixed(1)} days</title></circle>`;
  });

  const yA = TOP + series.length * ROW;
  svg += `<line class="axis" x1="${x0}" y1="${yA}" x2="${x1}" y2="${yA}"/>`;
  const st = niceStep(maxAll);
  for (let v = 0; v <= maxAll; v += st)
    svg += `<text class="tick" x="${sx(v)}" y="${yA + 15}" text-anchor="middle">${v}</text>`;
  svg += `<text x="${W / 2}" y="${H - 4}" text-anchor="middle">days since application</text></svg>`;
  return svg;
}

/**
 * Draw the Timing tab: headline tiles, three histograms, the shared-scale range
 * chart, and the top-10 longest-waiting applications.
 * @param {object[]} jobs - every row from /api/jobs.
 * @returns {void} replaces #timing's contents, then measures each plot container
 *   and fills in its SVG — the charts need a laid-out width, so they cannot be
 *   built in the same pass as the markup.
 */
function renderTiming(jobs) {
  const root = document.getElementById("timing");
  if (!jobs.length) { root.innerHTML = `<p class="tm-empty">No applications yet.</p>`; return; }

  const today = todayISO();
  const toInterview = durations(jobs, "interview_date");
  const toReject = durations(jobs, "rejected_date", j => !j.interview_date);
  const stillOpen = openAges(jobs, today);
  const ghosted = stillOpen.filter(d => d >= GHOST_DAYS).length;
  const ivRate = jobs.filter(j => j.interview_date).length / jobs.length;

  // one headline tile: label, big number, and the caption under it
  const tile = (lbl, val, sub) =>
    `<div class="tm-tile"><div class="lbl">${lbl}</div><div class="val">${val}</div>`
    + `<div class="sub">${sub}</div></div>`;
  // a tile's median value, or an em dash when nothing has reached that milestone
  const days = xs => xs.length ? `${median(xs)}d` : "—";

  const wasters = jobs
    .filter(isOpen)
    .map(j => ({ ...j, days: elapsedDays(j.applied_date, today) }))
    .filter(j => Number.isFinite(j.days) && j.days >= 0)
    .sort((a, b) => b.days - a.days)
    .slice(0, 10);

  root.innerHTML = `
    <div class="tm-tiles">
      ${tile("Median time to interview", days(toInterview), `n=${toInterview.length}`)}
      ${tile("Median time to rejection", days(toReject), `n=${toReject.length}, no interview`)}
      ${tile("Interview rate", `${Math.round(ivRate * 100)}%`, `of ${plural(jobs.length, "application")}`)}
      ${tile("Ghosted", ghosted, `applied, no reply in ${GHOST_DAYS}d`)}
    </div>
    <div class="tm-grid">
      <div class="tm-card">
        <h2>Time to interview</h2>
        <p class="cap">Applications that reached an interview. n=${toInterview.length}.</p>
        <div class="plot" id="tmHistIv"></div>
      </div>
      <div class="tm-card">
        <h2>Time to rejection</h2>
        <p class="cap">Rejections with no interview. Jobs rejected after interviewing are excluded. n=${toReject.length}.</p>
        <div class="plot" id="tmHistRj"></div>
      </div>
      <div class="tm-card">
        <h2>Still waiting</h2>
        <p class="cap">Applied, no interview and no rejection. These are lower bounds — the wait is still running. n=${stillOpen.length}.</p>
        <div class="plot" id="tmHistOp"></div>
      </div>
    </div>
    <div class="tm-card">
      <h2>Mean and median, same scale</h2>
      <p class="cap">The rule spans the observed range; markers sit at the mean and median.
        The arrow means that row is still open, so its rule keeps growing to the right.</p>
      <div class="tm-key"><span>● mean</span><span>┃ median</span><span>▶ still open</span></div>
      <div class="plot" id="tmRange"></div>
    </div>
    <div class="tm-card">
      <h2>Top 10 time wasters</h2>
      <p class="cap">Longest-running applications that have gone nowhere — no interview, no rejection, still waiting.</p>
      ${wasters.length ? `<table class="mkt-table"><thead><tr>
        <th>Company</th><th>Title</th><th>Applied</th><th>Days waiting</th>
      </tr></thead><tbody>${wasters.map(j => `<tr>
        <td>${esc(j.company)}</td><td>${esc(j.title)}</td>
        <td>${j.applied_date}</td>
        <td style="font-variant-numeric: tabular-nums">${j.days}</td>
      </tr>`).join("")}</tbody></table>` : `<p class="tm-empty">Nothing is still waiting.</p>`}
    </div>`;

  // measure after layout, like renderFlow does
  const ivEl = document.getElementById("tmHistIv"), rjEl = document.getElementById("tmHistRj");
  const opEl = document.getElementById("tmHistOp");
  ivEl.innerHTML = histogramSVG(toInterview, C_INTERVIEW, ivEl.clientWidth);
  rjEl.innerHTML = histogramSVG(toReject, C_REJECT, rjEl.clientWidth);
  opEl.innerHTML = histogramSVG(stillOpen, C_APPLIED, opEl.clientWidth);
  const rgEl = document.getElementById("tmRange");
  rgEl.innerHTML = rangeChartSVG([
    { label: "Interview", color: C_INTERVIEW, values: toInterview },
    { label: "Reject, no interview", color: C_REJECT, values: toReject },
    { label: "Open, no response", color: C_APPLIED, values: stillOpen, open: true },
  ], rgEl.clientWidth);
}

// Open /#selftest and read the console. A hash, not ?selftest: app.py routes on the
// exact path, so a query string 404s before index.html is ever served.

/**
 * Assert two values are deeply equal, by JSON shape.
 * @param {*} a - what the code produced.
 * @param {*} b - what it should be.
 * @param {string} msg - what is being checked, printed on failure.
 * @returns {void} logs a console assertion; never throws, so one failure does not
 *   stop the rest of a self-test.
 */
const eq = (a, b, msg) => console.assert(JSON.stringify(a) === JSON.stringify(b), msg, a, "!=", b);

/**
 * Self-test: the Timing tab's statistics and binning.
 * @returns {void} console assertions over median, binWidth, histogramBins,
 *   durations and openAges.
 */
function timingSelfTest() {
  eq(median([3, 1, 2]), 2, "median, odd length");
  eq(median([4, 1, 2, 3]), 2.5, "median, even length");
  eq(binWidth(100), 7, "binWidth stays at 7 while <= 20 bins");
  eq(binWidth(200), 14, "binWidth doubles past the 20-bin threshold");
  eq(histogramBins([0, 7, 13]).counts, [1, 2], "a value on a bin edge counts once, in the upper bin");
  eq(durations([
    { applied_date: "2026-01-10", rejected_date: "2026-01-01" },   // negative span
    { applied_date: "2026-01-01", rejected_date: null },           // no milestone
    { applied_date: "2026-01-01", rejected_date: "2026-01-08" },   // 7 days
  ], "rejected_date"), [7], "durations drops negative and missing spans");

  const A = "2026-01-01";
  eq(openAges([
    { applied_date: A, status: "applied", interview_date: null, offer_date: null, rejected_date: null },
    { applied_date: A, status: "applied", interview_date: "2026-01-05", offer_date: null, rejected_date: null },
    { applied_date: A, status: "applied", interview_date: null, offer_date: null, rejected_date: "2026-01-05" },
    { applied_date: A, status: "interviewing", interview_date: null, offer_date: null, rejected_date: null },
    { applied_date: "2026-01-20", status: "applied", interview_date: null, offer_date: null, rejected_date: null },
  ], "2026-01-11"), [10], "open = applied, no milestone, not moved, not future-dated");
  console.log("timing self-test done");
}
// the #selftest dispatch lives at the bottom of this script, after every helper the
// tests touch is initialized — `const` bindings are not hoisted the way functions are.

// --- market research (own DB via /api/research/*) ---
const LEVELS = ["intern", "entry", "mid", "senior"];

/**
 * A textarea's lines as a clean list.
 * @param {string} s - newline-separated text.
 * @returns {string[]} the lines, trimmed, with blanks dropped.
 */
const linesToList = s => s.split("\n").map(t => t.trim()).filter(Boolean);

/**
 * A comma-joined string as a clean list — the storage format for skills and cities.
 * @param {string} s - comma-separated text, or null.
 * @returns {string[]} the entries, trimmed, with blanks dropped.
 */
const commaToList = s => (s || "").split(",").map(t => t.trim()).filter(Boolean);

// Sort state lives out here so Save/Scan/tab-switch re-renders keep the active column.
// A module var, not localStorage: it survives a re-render and resets on reload.
let mktSort = { key: null, dir: 1 };   // key: "title" | "company"; dir: 1 asc, -1 desc
// Which level boxes are ticked *in the view*, which is not the saved profile: ticking one
// filters the table now, without a save or a rescan. null = untouched, follow the profile.
// Survives renderMarket() the way mktSort does, so a Scan doesn't silently re-show what
// you just unchecked. [] is a real value (all unchecked = show any level), hence `??`.
let mktLevels = null;

/**
 * A posting's seniority as a sortable rank.
 *
 * Level is ordinal, not alphabetical: sorted as text, "entry" would land before
 * "intern". LEVELS already holds the right order, so rank by index.
 *
 * @param {object} m - a match row.
 * @returns {number} its index in LEVELS; LEVELS.length for an unknown or blank
 *   level, so those sort last.
 */
const levelRank = m => { const i = LEVELS.indexOf(m.skill_level); return i < 0 ? LEVELS.length : i; };

/**
 * A comparator for the market table's [tr, match] pairs.
 *
 * localeCompare does case- and accent-insensitive ordering natively — no lowercasing,
 * no collator library. The .trim() is there because the feed's location field keeps
 * its surrounding whitespace (research.py trims only title/company), and a leading
 * space sorts ahead of every letter, so the order would contradict the text the user
 * actually sees in the cell.
 *
 * @param {string} key - the match field to sort on; "skill_level" ranks by LEVELS.
 * @param {number} dir - 1 ascending, -1 descending.
 * @returns {(a: [Element, object], b: [Element, object]) => number} a comparator.
 *   Array.sort is stable, so ties keep the DB's newest-first order.
 */
const byField = (key, dir) => key === "skill_level"
  ? (a, b) => dir * (levelRank(a[1]) - levelRank(b[1]))
  : (a, b) => dir * (a[1][key] || "").trim().localeCompare((b[1][key] || "").trim(), undefined, { sensitivity: "base" });

/**
 * Build a title-matching predicate from a filter-box query.
 *
 * A view-only filter over rows already in the DB — nothing is deleted, and no rescan
 * happens. Bare terms all have to match (AND-narrow); `-term` excludes. Note the
 * profile's own `titles` field ORs its terms; this ANDs, because a filter box is
 * expected to narrow.
 *
 * @param {string} query - e.g. "senior -staff".
 * @returns {(title: string) => boolean} true to keep the row. An empty query keeps
 *   everything; a bare "-" is not an exclude.
 */
function titleFilter(query) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const inc = terms.filter(t => t[0] !== "-");
  const exc = terms.filter(t => t[0] === "-").map(t => t.slice(1)).filter(Boolean);
  return title => {
    const t = (title || "").toLowerCase();
    return inc.every(w => t.includes(w)) && !exc.some(w => t.includes(w));
  };
}

/**
 * Build a card-matching predicate from the board's filter box.
 *
 * Company and title are matched as one string, so "acme engineer" narrows across both
 * fields at once and you never have to think about which field a term belongs to. Same
 * AND-narrow / `-term`-excludes rule as the Job search box, because it is the same
 * function underneath.
 *
 * @param {string} query - e.g. "acme senior" or "-recruiter".
 * @returns {(job: object) => boolean} true to keep the card. An empty query keeps everything.
 */
const boardFilter = query => {
  const pass = titleFilter(query);
  return job => pass(`${job.company} ${job.title}`);
};

/**
 * Build a location-matching predicate from a filter-box query.
 *
 * Locations are not titles: the placeholder promises "remote, san francisco", so
 * commas OR (a location is one place — ANDing them matches nothing). `-term` still
 * excludes, and wins over any include.
 *
 * @param {string} query - e.g. "remote, san francisco" or "-remote".
 * @returns {(text: string) => boolean} true to keep the row. Feed it locText(), not
 *   the raw location: matching the canonical cities as well is what lets "san
 *   francisco" find a row reading "SF Office". An empty query keeps everything.
 */
function locationFilter(query) {
  const clauses = (query || "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean);
  const inc = clauses.filter(c => c[0] !== "-");
  const exc = clauses.filter(c => c[0] === "-").map(c => c.slice(1)).filter(Boolean);
  return text => {
    const t = (text || "").toLowerCase();
    if (exc.some(w => t.includes(w))) return false;
    return !inc.length || inc.some(w => t.includes(w));
  };
}
/**
 * Everything a location filter should match against for one row.
 * @param {object} r - a match row, with `location` (raw feed text) and `cities`
 *   (locations.py's canonical answer, comma-joined; absent until it has run).
 * @returns {string} both, comma-joined, with the missing side left out.
 */
const locText = r => [r.location, r.cities].filter(Boolean).join(", ");

/**
 * Is this url safe to put in an href?
 *
 * The row urls are scraped from a third-party feed, so only http(s) is linkified: a
 * `javascript:` url in an href runs in this page's origin (localhost:8000) when
 * clicked. enrich.py refuses to fetch anything but http(s), so this is the
 * render-side half of the same allowlist.
 *
 * @param {string} url - the scraped url.
 * @returns {boolean} true only for an absolute http(s) url. Parsed against a base
 *   so a relative or garbage url can't slip through, and re-tested against the raw
 *   string so a relative path doesn't inherit the page's own scheme.
 */
function safeHref(url) {
  try { return ["http:", "https:"].includes(new URL(url, location.origin).protocol) && /^https?:/i.test(url); }
  catch { return false; }
}

/**
 * Self-test: safeHref accepts real posting links and refuses executable schemes.
 * @returns {void} console assertions.
 */
function safeHrefSelfTest() {
  eq(safeHref("https://jobs.ashbyhq.com/x/y"), true,  "https is linkified");
  eq(safeHref("http://block.xyz/careers/1"),   true,  "http is linkified");
  eq(safeHref("javascript:alert(1)"),          false, "javascript: is refused");
  eq(safeHref("JavaScript:alert(1)"),          false, "scheme match is case-insensitive");
  eq(safeHref("data:text/html,<script>1<\/script>"), false, "data: is refused");
  eq(safeHref("/careers/123"),                 false, "a relative url is not a real posting link");
  eq(safeHref(""),                             false, "empty is refused");
  console.log("safeHref self-test done");
}

/**
 * Build a seniority predicate from the checked level boxes.
 *
 * Same rule as the profile's own `levels`: nothing checked means "any level", not "no
 * levels", and every box checked means the same thing. A row whose level the source
 * left blank shows only under that no-restriction case — Speedrun states no seniority
 * for most roles, and dropping them while the boxes say "all four" would leave the tab
 * showing fewer rows than the match count beside it.
 *
 * @param {string[]} checked - the ticked level values.
 * @returns {(level: string|null) => boolean} true to keep the row.
 */
function levelFilter(checked) {
  const want = new Set(checked);
  return level => !want.size || want.size === LEVELS.length || want.has(level);
}

/**
 * Self-test: levelFilter's "none checked" and "all checked" both mean no restriction.
 * @returns {void} console assertions, including the blank-level cases.
 */
function levelFilterSelfTest() {
  const keep = (checked, level) => levelFilter(checked)(level);
  eq(keep(["mid", "senior"], "senior"), true,  "checked level shows");
  eq(keep(["mid", "senior"], "intern"), false, "unchecked level hides");
  eq(keep([], "intern"),                true,  "nothing checked means any level, not none");
  eq(keep(LEVELS, "intern"),            true,  "all four checked shows every known level");
  eq(keep(["mid"], null),               false, "a blank level is not 'mid'");
  eq(keep([], null),                    true,  "a blank level survives the any-level case");
  eq(keep(LEVELS, null),                true,  "all four checked is no restriction, so blanks show too");
  eq(keep(["mid", "senior"], null),     false, "narrowing to some levels still drops blanks");
  console.log("level filter self-test done");
}

/**
 * Self-test: the board box matches across company and title, and excludes.
 * @returns {void} console assertions.
 */
function boardFilterSelfTest() {
  const job = { company: "Acme Corp", title: "Senior Engineer" };
  eq(boardFilter("")(job),            true,  "an empty box keeps every card");
  eq(boardFilter("acme")(job),        true,  "company matches, case-insensitively");
  eq(boardFilter("engineer")(job),    true,  "title matches");
  eq(boardFilter("acme senior")(job), true,  "terms spanning both fields still AND-narrow");
  eq(boardFilter("acme staff")(job),  false, "a term matching neither field drops the card");
  eq(boardFilter("-acme")(job),       false, "-term excludes");
  console.log("boardFilter self-test done");
}

/**
 * Self-test: titleFilter ANDs its include terms and lets an exclude win.
 * @returns {void} console assertions.
 */
function titleFilterSelfTest() {
  const keep = (q, title) => titleFilter(q)(title);
  eq(keep("senior -staff", "Senior Software Engineer"), true,  "include hits, no excluded word");
  eq(keep("senior -staff", "Staff Engineer"),           false, "exclude wins over nothing to include");
  eq(keep("senior -staff", "Senior Staff Engineer"),    false, "exclude wins even when include hits");
  eq(keep("senior -staff", "Mid-level Engineer"),       false, "missing include term");
  eq(keep("senior backend", "Senior Backend Engineer"), true,  "includes AND together");
  eq(keep("senior backend", "Senior Frontend Engineer"),false, "AND: one include missing");
  eq(keep("", "anything at all"),                       true,  "empty query keeps everything");
  eq(keep("-", "Staff Engineer"),                       true,  "bare dash is not an exclude");
  console.log("title filter self-test done");
}

/**
 * Self-test: locationFilter ORs its clauses and matches canonical cities too.
 * @returns {void} console assertions, including the fan-out case where a two-city
 *   posting only charts the city the filter asked for.
 */
function locationFilterSelfTest() {
  const keep = (q, r) => locationFilter(q)(locText(r));
  const row = (location, cities) => ({ location, cities });
  eq(keep("san francisco", row("SF Office", "San Francisco")), true,  "matches the canonical city, not just raw text");
  eq(keep("san francisco", row("San Francisco, CA", "")),       true,  "matches raw text when unmapped");
  eq(keep("remote, san francisco", row("Remote - US", "Remote")), true, "commas OR");
  eq(keep("remote, san francisco", row("Austin, TX", "Austin")), false, "OR: neither clause hits");
  eq(keep("-remote", row("San Francisco, CA or Remote", "San Francisco,Remote")), false, "exclude wins");
  eq(keep("", row("anywhere", "")),                             true,  "empty query keeps everything");
  // the fan-out fix: a two-city posting only charts the city the filter asked for
  const pass = locationFilter("san francisco");
  eq(locationBucket("SF | NYC", "San Francisco,New York").filter(pass), ["San Francisco"], "filtered fan-out");
  console.log("location filter self-test done");
}

/**
 * Self-test: byField's ordering — case, accents, whitespace, nulls, stability, and
 * the ordinal level rank.
 * @returns {void} console assertions. byField sorts the [tr, match] pairs
 *   renderMarket builds; only the match half matters here.
 */
