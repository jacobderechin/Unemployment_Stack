function mktSortSelfTest() {
  const pairs = (...ms) => ms.map(m => [null, m]);
  const titles = rs => rs.map(r => r[1].title);

  const mixed = pairs({ title: "beta" }, { title: "Alpha" }, { title: "gamma" });
  eq(titles(mixed.slice().sort(byField("title", 1))), ["Alpha", "beta", "gamma"], "title asc ignores case");
  eq(titles(mixed.slice().sort(byField("title", -1))), ["gamma", "beta", "Alpha"], "title desc reverses");

  const co = pairs({ company: "Zoox" }, { company: "acme" });
  eq(co.slice().sort(byField("company", 1)).map(r => r[1].company), ["acme", "Zoox"], "company asc ignores case");

  eq(titles(pairs({ title: null }, { title: "a" }).sort(byField("title", 1))), [null, "a"], "null title sorts as empty, no throw");

  const tied = pairs({ title: "same", company: "first" }, { title: "same", company: "second" });
  eq(tied.slice().sort(byField("title", 1)).map(r => r[1].company), ["first", "second"], "equal titles keep original order (stable)");

  const loc = pairs({ location: "San Francisco" }, { location: "austin" });
  eq(loc.slice().sort(byField("location", 1)).map(r => r[1].location), ["austin", "San Francisco"], "location asc ignores case");
  // the feed ships locations like " NC - Charlotte " — untrimmed, a leading space would sort them first
  const pad = pairs({ location: " zeta " }, { location: "alpha" });
  eq(pad.slice().sort(byField("location", 1)).map(r => r[1].location.trim()), ["alpha", "zeta"], "surrounding whitespace does not drag a row to the top");

  // Level must rank by LEVELS, not by text — this is the whole reason levelRank exists.
  eq(["senior", "intern", "entry"].slice().sort(), ["entry", "intern", "senior"], "sanity: plain text sort really does put entry before intern");
  const lv = pairs({ skill_level: "senior" }, { skill_level: "intern" }, { skill_level: "mid" }, { skill_level: "entry" });
  const lvs = rs => rs.map(r => r[1].skill_level);
  eq(lvs(lv.slice().sort(byField("skill_level", 1))), ["intern", "entry", "mid", "senior"], "level asc follows LEVELS order");
  eq(lvs(lv.slice().sort(byField("skill_level", -1))), ["senior", "mid", "entry", "intern"], "level desc reverses LEVELS order");
  eq(lvs(pairs({ skill_level: "senior" }, { skill_level: null }, { skill_level: "intern" }).sort(byField("skill_level", 1))),
     ["intern", "senior", null], "an unknown level sorts last, not first");
  console.log("market sort self-test done");
}

// --- salary / market research (aggregates the scraped feed, all client-side) ---
let salRows = null;      // fetched postings with a parsed `_sal`, re-fetched each renderSalary
let salLevels = null;    // checked seniority — survives an apply() the way mktLevels does
let salJobs = [];        // job buckets picked in the skills comparison dropdown — survives an apply()

const HOURS_PER_YEAR = 2080;

/**
 * Format a salary for an axis tick or a table cell.
 * @param {number} v - dollars per year.
 * @returns {string} e.g. "$225k", or an em dash for a non-finite value.
 */
const dollarK = v => Number.isFinite(v) ? "$" + Math.round(v / 1000) + "k" : "—";

/**
 * Parse a posting's free-text pay into an annual band.
 *
 * Salary arrives exactly as the posting wrote it: "$225,000 - $320,000", "$170K -
 * $320K", "180k - 300k", en and em dashes, "to" as the separator, USD as a prefix or
 * a suffix. Every number is pulled out, a K suffix multiplies it, and the min and max
 * become the band. A bare figure under $2000 can't be an annual salary, so it is read
 * as an hourly rate and annualised — crude, but postings carry no explicit /hr flag.
 *
 * @param {string} raw - the salary text, or null.
 * @returns {{lo: number, hi: number}|null} the annual band, or null when there are no
 *   numbers or the result lands outside any real salary range (a parse artifact).
 */
function parseSalary(raw) {
  if (!raw) return null;
  const nums = [...String(raw).matchAll(/(\d[\d,]*\.?\d*)\s*([kK])?/g)]
    .map(m => { let n = parseFloat(m[1].replace(/,/g, "")); if (m[2]) n *= 1000; return n; })
    .filter(n => Number.isFinite(n) && n > 0)
    .map(n => n < 2000 ? n * HOURS_PER_YEAR : n);
  if (!nums.length) return null;
  const lo = Math.min(...nums), hi = Math.max(...nums);
  if (hi < 10000 || lo > 2000000) return null;
  return { lo, hi };
}

// Title has 452 distinct values and location 174, almost all unique — collapse to buckets so a
// breakdown group has real n. First match wins, so order most-specific first. Edit freely.
const TITLE_BUCKETS = [
  [/machine learning|\bml\b|deep learning|\bai\b|nlp|computer vision/i, "ML Engineer"],
  [/data scien/i, "Data Scientist"],
  [/research scien|research engineer|applied scien/i, "Research Scientist"],
  [/data engineer|analytics engineer|\betl\b|platform engineer/i, "Data Engineer"],
  [/data analyst|business analyst|\banalyst\b/i, "Data Analyst"],
  [/software engineer|\bswe\b|backend|front.?end|full.?stack|developer/i, "Software Engineer"],
  [/manager|director|\blead\b|head of|\bvp\b|principal/i, "Manager / Lead"],
  [/product/i, "Product"],
];
/**
 * Which job-title bucket a posting belongs to.
 *
 * Grouped by the search profile's own title terms (the ones listed on the Job search
 * tab) so the breakdown mirrors that tab: a posting falls into the first search term
 * its title contains — the same case-insensitive substring rule the profile itself
 * uses. Falls back to the built-in TITLE_BUCKETS keywords only when no search titles
 * are set, so the tab still works out of the box.
 *
 * @param {string} title - the posting's title.
 * @param {string[]} terms - the profile's title terms; empty to use the fallback.
 * @returns {string} the bucket label, or "Other" when nothing matches.
 */
function titleBucket(title, terms) {
  const t = (title || "").toLowerCase();
  if (terms && terms.length) return terms.find(term => t.includes(term.toLowerCase())) || "Other";
  for (const [re, label] of TITLE_BUCKETS) if (re.test(title || "")) return label;
  return "Other";
}
// Feed locations fragment badly ("SF Office", "Hybrid (NYC Metro)", "Strava SF"), so locations.py
// canonicalises each distinct string with the local model and research.list_matches joins the
// answer in as `cities` — comma-joined, and more than one when a posting names several.
// The METROS list below is only the fallback for rows the model has not seen (Ollama never run,
// or off). It stays deliberately dumb: knowing that Bengaluru is Bangalore is the model's job,
// and a hand-maintained alias table is exactly what this replaced.
const METROS = ["San Francisco", "New York", "Seattle", "Los Angeles", "Boston", "Austin",
  "Chicago", "Denver", "Atlanta", "Washington", "Mountain View", "Palo Alto", "San Jose",
  "Toronto", "London"];
/**
 * Which city or cities a posting counts toward.
 *
 * A named city beats the working arrangement: "San Francisco, CA, US; Remote, US" is
 * an SF salary, and testing /remote/i first (as this used to) swallowed every hybrid
 * posting into Remote.
 *
 * @param {string} loc - the raw feed location.
 * @param {string} [cities] - locations.py's canonical answer, comma-joined.
 * @returns {string[]|string} an array of cities when the model has mapped that raw
 *   string — the caller fans the posting out into each. Otherwise a single label
 *   from the METROS fallback, the leading comma segment, or "Other".
 */
function locationBucket(loc, cities) {
  const mapped = (cities || "").split(",").map(s => s.trim()).filter(Boolean);
  if (mapped.length) return mapped;
  const l = (loc || "").trim();
  if (!l) return "Other";
  const metro = METROS.find(m => l.toLowerCase().includes(m.toLowerCase()));
  if (metro) return metro;
  if (/remote/i.test(l)) return "Remote";
  return l.split(",")[0].trim() || "Other";
}

/**
 * Sample standard deviation.
 * @param {number[]} xs
 * @returns {number} the SD, or 0 for n<2 — a single posting has no spread to draw a
 *   whisker from.
 */
const stdev = xs => {
  if (xs.length < 2) return 0;
  const m = mean(xs);
  return Math.sqrt(xs.reduce((a, x) => a + (x - m) ** 2, 0) / (xs.length - 1));
};

/**
 * Aggregate salaried postings into groups.
 *
 * keyFn may return several keys — a posting open in SF and NYC belongs in both, so its
 * band counts in each. That makes the n column sum to more than the posting count,
 * which is the right trade for a "what does this city pay" table. String-returning
 * keyFns are unaffected.
 *
 * @param {object[]} rows - postings, each with a parsed `_sal`; rows without one are
 *   skipped.
 * @param {(r: object) => string|string[]} keyFn - the grouping key(s) for a row.
 * @returns {{label: string, n: number, loMean: number, loMed: number, loSD: number,
 *   hiMean: number, hiMed: number, hiSD: number}[]} one entry per group, with the low
 *   and high ends of the band aggregated separately. A row whose keyFn yields nothing
 *   lands in "Other".
 */
function salaryGroups(rows, keyFn) {
  const groups = new Map();
  for (const r of rows) {
    if (!r._sal) continue;
    const keys = [keyFn(r)].flat().filter(Boolean);
    for (const key of (keys.length ? keys : ["Other"])) {
      if (!groups.has(key)) groups.set(key, { los: [], his: [] });
      const g = groups.get(key);
      g.los.push(r._sal.lo);
      g.his.push(r._sal.hi);
    }
  }
  return [...groups].map(([label, g]) => ({
    label, n: g.los.length,
    loMean: mean(g.los), loMed: median(g.los), loSD: stdev(g.los),
    hiMean: mean(g.his), hiMed: median(g.his), hiSD: stdev(g.his),
  }));
}
/**
 * Put seniority groups in ladder order and capitalise their labels.
 * @param {object[]} groups - salaryGroups' output, keyed by skill_level.
 * @returns {object[]} the groups in LEVELS order, dropping any level absent from
 *   this slice.
 */
const orderByLevel = groups => LEVELS
  .map(lvl => groups.find(g => g.label === lvl))
  .filter(Boolean)
  .map(g => ({ ...g, label: g.label[0].toUpperCase() + g.label.slice(1) }));

/**
 * The n biggest groups, so a breakdown shows the ones with real sample sizes.
 * @param {object[]} groups - salaryGroups' output.
 * @param {number} n - how many to keep.
 * @returns {object[]} a new array, sorted by n descending and truncated.
 */
const topGroups = (groups, n) => groups.slice().sort((a, b) => b.n - a.n).slice(0, n);

/**
 * The salary breakdown table for one grouping.
 * @param {object[]} groups - salaryGroups' output.
 * @returns {string} the table markup, or an empty-state paragraph.
 */
function salTable(groups) {
  if (!groups.length) return `<p class="tm-empty">No salary data in this slice.</p>`;
  const body = groups.map(g =>
    `<tr><td>${esc(g.label)}</td><td class="num">${g.n}</td>`
    + `<td class="num">${dollarK(g.loMean)}</td><td class="num">${dollarK(g.loMed)}</td>`
    + `<td class="num">${dollarK(g.hiMean)}</td><td class="num">${dollarK(g.hiMed)}</td></tr>`).join("");
  return `<table class="mkt-table"><thead><tr><th>Group</th><th class="num">n</th>`
    + `<th class="num">Low mean</th><th class="num">Low median</th>`
    + `<th class="num">High mean</th><th class="num">High median</th></tr></thead><tbody>${body}</tbody></table>`;
}

/**
 * The salary breakdown as a chart: one row per group, two error bars each.
 *
 * Each bar is a dot at the mean, a tick at the median, and whiskers at mean ± 1 SD
 * (clamped at 0). Low and high ends sit on separate tracks so they never tangle, and
 * every row shares one dollar x-axis. Adapted from rangeChartSVG.
 *
 * @param {object[]} groups - salaryGroups' output.
 * @param {number} width - the measured container width in px.
 * @returns {string} the SVG markup, or "" for no groups.
 */
function salaryRangeSVG(groups, width) {
  if (!groups.length) return "";
  const maxAxis = Math.max(...groups.flatMap(g => [g.loMean + g.loSD, g.loMed, g.hiMean + g.hiSD, g.hiMed]));
  const W = Math.max(360, width), PAD_L = 200, PAD_R = 24, TOP = 8, ROW = 56, AXIS = 28, DY = 9;
  const H = TOP + groups.length * ROW + AXIS;
  const x0 = PAD_L, x1 = W - PAD_R;
  const sx = v => x0 + (maxAxis ? v / maxAxis : 0) * (x1 - x0);
  const ACCENT = "var(--pair-a)";
  /**
   * One error bar on its own horizontal track.
   * @param {number} y - the track's baseline.
   * @param {number} meanV - where the dot goes.
   * @param {number} medV - where the tick goes.
   * @param {number} sd - half the whisker span.
   * @param {string} label - already escaped; used in the hover title.
   * @returns {string} the whisker, its caps, the median tick and the mean dot.
   */
  const errBar = (y, meanV, medV, sd, label) => {
    const lo = Math.max(0, meanV - sd), hi = meanV + sd;
    return `<line x1="${sx(lo)}" y1="${y}" x2="${sx(hi)}" y2="${y}" stroke="${ACCENT}" stroke-width="2" stroke-opacity=".4"/>`
      + [lo, hi].map(v => `<line x1="${sx(v)}" y1="${y - 4}" x2="${sx(v)}" y2="${y + 4}" stroke="${ACCENT}" stroke-width="2" stroke-opacity=".4"/>`).join("")
      + `<line x1="${sx(medV)}" y1="${y - 6}" x2="${sx(medV)}" y2="${y + 6}" stroke="var(--surface)" stroke-width="4"/>`
      + `<line x1="${sx(medV)}" y1="${y - 6}" x2="${sx(medV)}" y2="${y + 6}" stroke="${ACCENT}" stroke-width="2"/>`
      + `<circle cx="${sx(meanV)}" cy="${y}" r="4.5" fill="${ACCENT}" stroke="var(--surface)" stroke-width="2">`
      + `<title>${label}: mean ${dollarK(meanV)} ± ${dollarK(sd)} · median ${dollarK(medV)}</title></circle>`;
  };
  // Group labels are profile-driven ("Forward Deployed Engineer"), so they need real room:
  // end-anchored text runs off the left edge of the viewBox rather than wrapping. n= goes on
  // its own line so the label gets the full gutter, and clip() is the backstop past that.
  // The cap counts characters but the gutter is pixels, so it holds for job titles (widest
  // measured 163px against a 190px gutter) and not for pathological input — 26 capital Ws
  // need 297px and would still overflow. Swap in textLength if a real title ever clips.
  const clip = s => s.length > 26 ? s.slice(0, 25) + "…" : s;
  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  groups.forEach((g, i) => {
    const yc = TOP + i * ROW + ROW / 2;
    svg += `<text x="${x0 - 10}" y="${yc - 8}" text-anchor="end" dominant-baseline="middle" class="row-name">`
         + `${esc(clip(g.label))}<title>${esc(g.label)}</title></text>`
         + `<text x="${x0 - 10}" y="${yc + 10}" text-anchor="end" dominant-baseline="middle" class="tick">n=${g.n}</text>`
         + errBar(yc - DY, g.loMean, g.loMed, g.loSD, esc(g.label) + " low")
         + errBar(yc + DY, g.hiMean, g.hiMed, g.hiSD, esc(g.label) + " high");
  });
  const yA = TOP + groups.length * ROW;
  svg += `<line class="axis" x1="${x0}" y1="${yA}" x2="${x1}" y2="${yA}"/>`;
  const st = niceStep(maxAxis);
  for (let v = 0; v <= maxAxis; v += st)
    svg += `<text class="tick" x="${sx(v)}" y="${yA + 15}" text-anchor="middle">${dollarK(v)}</text>`;
  return svg + `</svg>`;
}

/**
 * Tally how many postings list each skill.
 * @param {object[]} rows - postings; `skills` is one comma-joined string each, and a
 *   row without it is skipped.
 * @returns {{label: string, n: number}[]} one entry per distinct skill, counted
 *   case-insensitively but keeping a first-seen spelling for display, most common
 *   first.
 */
function skillCounts(rows) {
  const counts = new Map();
  for (const r of rows) {
    if (!r.skills) continue;
    for (const raw of r.skills.split(",")) {
      const s = raw.trim();
      if (!s) continue;
      const e = counts.get(s.toLowerCase()) || { label: s, n: 0 };
      e.n++;
      counts.set(s.toLowerCase(), e);
    }
  }
  return [...counts.values()].sort((a, b) => b.n - a.n);
}
/**
 * The in-demand skills as a word cloud.
 *
 * A sequential encoding: size AND ink both track frequency — rarer is smaller and
 * muted, common is bigger and darker. Frequency still drives both, but the words are
 * laid out in a stable, size-interspersed order (hashed by label) so big and small
 * ones mix into a cloud instead of stacking big-first into a rectangle.
 *
 * @param {{label: string, n: number}[]} skills - skillCounts' output.
 * @param {number} [topN] - how many of the most common to show.
 * @returns {string} the cloud markup, or an empty-state paragraph.
 */
function skillCloud(skills, topN = 40) {
  const top = skills.slice(0, topN);
  if (!top.length) return `<p class="tm-empty">No skills in this slice.</p>`;
  const maxN = top[0].n, minN = top[top.length - 1].n, span = Math.max(1, maxN - minN);
  const size = n => (13 + 30 * Math.sqrt((n - minN) / span)).toFixed(0);
  const ink = n => { const t = (n - minN) / span; return t > .66 ? "var(--ink)" : t > .33 ? "var(--pair-a)" : "var(--ink-2)"; };
  const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };
  const arranged = top.slice().sort((a, b) => hash(a.label) - hash(b.label));
  return `<div class="skill-cloud">` + arranged.map(s =>
    `<span style="font-size:${size(s.n)}px;color:${ink(s.n)}" title="${esc(s.label)}: ${s.n}">${esc(s.label)}</span>`
  ).join("") + `</div>`;
}
/**
 * The most-asked-for skills as a horizontal bar chart.
 * @param {{label: string, n: number}[]} skills - skillCounts' output.
 * @param {number} width - the measured container width in px.
 * @param {number} [topN] - how many bars to draw.
 * @returns {string} the SVG markup, or "" when there are no skills.
 */
function skillBarsSVG(skills, width, topN = 20) {
  const top = skills.slice(0, topN);
  if (!top.length) return "";
  const W = Math.max(360, width), PAD_L = 170, PAD_R = 40, ROW = 22, TOP = 6;
  const H = TOP + top.length * ROW + 4;
  const maxN = top[0].n, x1 = W - PAD_R;
  const sx = n => (maxN ? n / maxN : 0) * (x1 - PAD_L);
  const clip = s => s.length > 24 ? s.slice(0, 23) + "…" : s;
  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  top.forEach((s, i) => {
    const y = TOP + i * ROW, w = Math.max(2, sx(s.n));
    svg += `<text x="${PAD_L - 8}" y="${y + ROW / 2}" text-anchor="end" dominant-baseline="middle" class="row-name">${esc(clip(s.label))}</text>`
         + `<rect x="${PAD_L}" y="${y + 3}" width="${w}" height="${ROW - 8}" rx="3" fill="var(--pair-a)"><title>${esc(s.label)}: ${s.n}</title></rect>`
         + `<text x="${PAD_L + w + 5}" y="${y + ROW / 2}" dominant-baseline="middle" class="cap-val">${s.n}</text>`;
  });
  return svg + `</svg>`;
}

/**
 * Group postings by job-title bucket — feeds the comparison and skill-gap dropdowns.
 * @param {object[]} rows - postings, usually pre-filtered to the skill-bearing ones.
 * @param {string[]} terms - the profile's title terms, passed through to titleBucket.
 * @returns {{label: string, rows: object[]}[]} one entry per bucket, biggest first.
 */
function jobBuckets(rows, terms) {
  const m = new Map();
  for (const r of rows) {
    const k = titleBucket(r.title, terms);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return [...m].map(([label, rs]) => ({ label, rows: rs })).sort((a, b) => b.rows.length - a.rows.length);
}

/**
 * How many of a slice's postings list each skill.
 * @param {object[]} rows - the postings in one slice.
 * @returns {{n: number, counts: Map<string, {label: string, c: number}>}} the slice
 *   size and a lowercased-key map of counts, so the caller can turn either into a
 *   rate.
 */
function skillRates(rows) {
  const counts = new Map();
  for (const r of rows) for (const raw of (r.skills || "").split(",")) {
    const s = raw.trim(); if (!s) continue;
    const e = counts.get(s.toLowerCase()) || { label: s, c: 0 };
    e.c++; counts.set(s.toLowerCase(), e);
  }
  return { n: rows.length, counts };
}
/**
 * Compare two job buckets by what their postings ask for.
 *
 * Rates, not raw counts, so buckets with different posting counts compare fairly.
 *
 * @param {object[]} rowsA - the first bucket's postings.
 * @param {object[]} rowsB - the second bucket's postings.
 * @param {number} [topN] - how many skills to keep.
 * @returns {{nA: number, nB: number, diffs: {label: string, rA: number, rB: number,
 *   diff: number}[]}} the two slice sizes, and each skill's rate on both sides sorted
 *   by the size of the gap. A skill seen only once across both is rate-noise and is
 *   dropped.
 */
function skillCompare(rowsA, rowsB, topN = 18) {
  const A = skillRates(rowsA), B = skillRates(rowsB);
  const diffs = [];
  for (const k of new Set([...A.counts.keys(), ...B.counts.keys()])) {
    const a = A.counts.get(k), b = B.counts.get(k);
    if ((a ? a.c : 0) + (b ? b.c : 0) < 2) continue;
    const rA = A.n ? (a ? a.c : 0) / A.n : 0, rB = B.n ? (b ? b.c : 0) / B.n : 0;
    diffs.push({ label: (a || b).label, rA, rB, diff: rA - rB });
  }
  diffs.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  return { nA: A.n, nB: B.n, diffs: diffs.slice(0, topN) };
}
/**
 * The two-job skill comparison as diverging bars.
 *
 * A leans right, B leans left, and bar length is the gap in share of postings, in
 * percentage points.
 *
 * @param {object} cmp - skillCompare's output.
 * @param {string} labelA - the right-hand job's name.
 * @param {string} labelB - the left-hand job's name.
 * @param {number} width - the measured container width in px.
 * @returns {string} the SVG markup, or an empty-state paragraph when the two jobs
 *   share no skills worth comparing.
 */
function skillCompareSVG(cmp, labelA, labelB, width) {
  const { diffs, nA, nB } = cmp;
  if (!diffs.length) return `<p class="tm-empty">No shared skills to compare between these jobs.</p>`;
  const A_COLOR = "var(--pair-a)", B_COLOR = "var(--pair-b)";   // CVD-safe diverging pair
  const W = Math.max(360, width), PAD_L = 160, PAD_R = 16, TOP = 34, ROW = 22, BOT = 8;
  const H = TOP + diffs.length * ROW + BOT;
  const cx = PAD_L + (W - PAD_L - PAD_R) / 2, half = (W - PAD_L - PAD_R) / 2 - 46;
  const maxDiff = Math.max(...diffs.map(d => Math.abs(d.diff))) || 1;
  const sx = d => (d / maxDiff) * half;
  const pp = d => (d >= 0 ? "+" : "−") + Math.round(Math.abs(d) * 100);
  const pct = r => Math.round(r * 100) + "%";
  const clip = s => s.length > 22 ? s.slice(0, 21) + "…" : s;
  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  svg += `<text x="${cx - 6}" y="16" text-anchor="end" class="row-name" fill="${B_COLOR}">◀ ${esc(labelB)} (n=${nB})</text>`
       + `<text x="${cx + 6}" y="16" class="row-name" fill="${A_COLOR}">${esc(labelA)} (n=${nA}) ▶</text>`
       + `<line class="axis" x1="${cx}" y1="${TOP - 6}" x2="${cx}" y2="${H - BOT}"/>`;
  diffs.forEach((d, i) => {
    const y = TOP + i * ROW + ROW / 2;
    const dx = sx(d.diff), x = dx >= 0 ? cx : cx + dx, w = Math.max(1, Math.abs(dx));
    const color = d.diff >= 0 ? A_COLOR : B_COLOR;
    const lx = d.diff >= 0 ? cx + w + 5 : cx - w - 5, anchor = d.diff >= 0 ? "start" : "end";
    svg += `<text x="${PAD_L - 8}" y="${y}" text-anchor="end" dominant-baseline="middle" class="row-name">${esc(clip(d.label))}</text>`
         + `<rect x="${x}" y="${y - 6}" width="${w}" height="12" rx="2" fill="${color}">`
         + `<title>${esc(d.label)}: ${pct(d.rA)} in ${esc(labelA)} vs ${pct(d.rB)} in ${esc(labelB)}</title></rect>`
         + `<text x="${lx}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" class="cap-val">${pp(d.diff)}pp</text>`;
  });
  return svg + `</svg>`;
}

/**
 * Draw the Salary tab's three breakdowns plus the skills panel, for one filtered slice.
 * @param {HTMLElement} container - #salResults; its contents are replaced.
 * @param {object[]} shown - every posting passing the filters.
 * @param {object[]} withSal - the subset that has a parsed salary.
 * @param {string[]} terms - the profile's title terms, for the by-title buckets.
 * @param {(text: string) => boolean} passL - the active location predicate. A posting
 *   open in SF and NYC lands in both buckets, so filtering to SF would otherwise still
 *   draw a New York row; only the buckets the filter asked for are kept. If none
 *   match, the row got in on its raw location text, so its buckets are left alone
 *   rather than dropping it off the chart.
 * @returns {void} also wires the two job dropdowns, which re-render the skills panel
 *   in place: one job focuses the cloud, two compare their skill rates.
 */
function renderSalResults(container, shown, withSal, terms, passL) {
  const W = Math.max(360, (container.clientWidth || 820) - 40);
  const bySen = orderByLevel(salaryGroups(withSal, r => r.skill_level));
  const byTitle = topGroups(salaryGroups(withSal, r => titleBucket(r.title, terms)), 12);
  const byLoc = topGroups(salaryGroups(withSal, r => {
    const b = locationBucket(r.location, r.cities);
    if (!Array.isArray(b)) return b;
    const kept = b.filter(passL);
    return kept.length ? kept : b;
  }), 12);

  /**
   * One breakdown card: heading, table, and the chart when there is data.
   * @param {string} heading - the card's title.
   * @param {object[]} groups - salaryGroups' output.
   * @returns {string} the card markup.
   */
  const section = (heading, groups) =>
    `<div class="sal-card"><h2>${heading}</h2>${salTable(groups)}`
    + (groups.length ? salaryRangeSVG(groups, W)
        + `<div class="tm-key">Upper track: low end &nbsp;·&nbsp; lower track: high end &nbsp;—&nbsp; Dot: mean &nbsp;·&nbsp; Tick: median &nbsp;·&nbsp; Whisker: ±1 SD</div>` : "")
    + `</div>`;

  container.innerHTML =
      section("Salary by seniority", bySen)
    + section("Salary by job title", byTitle)
    + section("Salary by location", byLoc)
    + `<div class="sal-card"><h2>In-demand skills</h2>`
    + `<div class="sal-skillbar"><label>Job<select id="salJobA"></select></label>`
    + `<label>Compare with<select id="salJobB"></select></label>`
    + `<span class="mkt-info">Pick a job to focus the cloud; choose a second to compare skill rates.</span></div>`
    + `<div id="salSkills"></div></div>`;

  // Two real dropdowns. Both live outside the innerHTML string so they keep their listeners; options
  // are the job buckets present in this slice. Only skill-bearing postings feed the skills panel.
  const skillRows = shown.filter(r => r.skills);
  const jobs = jobBuckets(skillRows, terms);
  const byLabel = new Map(jobs.map(j => [j.label, j.rows]));
  const selA = container.querySelector("#salJobA");
  const selB = container.querySelector("#salJobB");
  /**
   * Fill one job dropdown with the buckets present in this slice.
   * @param {HTMLSelectElement} sel - the dropdown.
   * @param {string} placeholder - the label for the empty first option.
   * @returns {void}
   */
  const fillOpts = (sel, placeholder) => {
    sel.innerHTML = "";
    const p = document.createElement("option");
    p.value = ""; p.textContent = placeholder;
    sel.appendChild(p);
    for (const j of jobs) {
      const o = document.createElement("option");
      o.value = j.label;
      o.textContent = `${j.label} (${j.rows.length})`;
      sel.appendChild(o);
    }
  };
  fillOpts(selA, "All jobs");
  fillOpts(selB, "— none —");
  selA.value = salJobs[0] || "";     // a stale value not in the new options resets to the placeholder
  selB.value = salJobs[1] || "";
  const skillsDiv = container.querySelector("#salSkills");
  /**
   * Redraw the skills panel for whatever the two dropdowns currently name.
   * @returns {void} two distinct jobs draw the diverging comparison; one or none
   *   draws the cloud and bars over that slice. Also records the picks so they
   *   survive the next apply().
   */
  const renderSkills = () => {
    salJobs = [selA.value, selB.value];
    const picked = [...new Set([selA.value, selB.value].filter(Boolean))];
    if (picked.length === 2) {
      skillsDiv.innerHTML = skillCompareSVG(skillCompare(byLabel.get(picked[0]) || [], byLabel.get(picked[1]) || []), picked[0], picked[1], W)
        + `<div class="tm-key">Difference in share of postings listing each skill (percentage points), biggest gaps first.</div>`;
    } else {
      const rows = picked.length ? skillRows.filter(r => picked.includes(titleBucket(r.title, terms))) : skillRows;
      const skills = skillCounts(rows);
      skillsDiv.innerHTML = skillCloud(skills) + skillBarsSVG(skills, W);
    }
  };
  selA.onchange = renderSkills;
  selB.onchange = renderSkills;
  renderSkills();
}

/**
 * Draw the Salary tab: fetch every alive posting, then filter and aggregate locally.
 * @returns {Promise<void>} replaces #salary with the filter bar and the results, and
 *   wires the title/location boxes and seniority checkboxes to re-filter in place.
 *   Nothing here refetches — the filters run over the rows already in hand.
 */
async function renderSalary() {
  const root = document.getElementById("salary");
  const [profile, rows] = await Promise.all([
    api("GET", "/api/research/profile"),
    api("GET", "/api/research/matches/all"),
  ]);
  for (const r of rows) r._sal = parseSalary(r.salary);
  salRows = rows;
  const terms = profile.titles || [];   // the Job search tab's own job-title list drives the by-title buckets

  root.innerHTML = `
    <div class="sal-filter">
      <label>Filter titles<input id="salTitle" type="search" placeholder="engineer -staff" autocomplete="off"></label>
      <label>Filter location<input id="salLoc" type="search" placeholder="remote, san francisco" autocomplete="off"></label>
      <fieldset id="salLevels"><legend>Seniority (none = all)</legend></fieldset>
      <span class="sal-info" id="salInfo"></span>
    </div>
    <div id="salResults"></div>`;

  const levelsBox = root.querySelector("#salLevels");
  for (const lvl of LEVELS) {
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" value="${lvl}"><span></span>`;
    lab.querySelector("span").textContent = lvl;
    lab.querySelector("input").checked = (salLevels || []).includes(lvl);
    levelsBox.appendChild(lab);
  }
  // the seniority boxes ticked right now, read straight off the DOM
  const checkedLevels = () => [...levelsBox.querySelectorAll("input:checked")].map(c => c.value);

  const titleBox = root.querySelector("#salTitle");
  const locBox = root.querySelector("#salLoc");
  const results = root.querySelector("#salResults");
  const info = root.querySelector("#salInfo");

  /**
   * Re-filter the postings and redraw everything below the filter bar.
   * @returns {void}
   */
  const apply = () => {
    const passT = titleFilter(titleBox.value), passL = locationFilter(locBox.value);
    const passLv = levelFilter(checkedLevels());
    const shown = salRows.filter(r => passT(r.title || "") && passL(locText(r)) && passLv(r.skill_level));
    const withSal = shown.filter(r => r._sal);
    info.textContent = `${shown.length} posting${shown.length === 1 ? "" : "s"} · ${withSal.length} with salary`;
    renderSalResults(results, shown, withSal, terms, passL);
  };

  titleBox.oninput = apply;
  locBox.oninput = apply;
  levelsBox.onchange = () => { salLevels = checkedLevels(); apply(); };
  apply();
}

// --- resume analysis (own endpoints via /api/resume/*) ---
//
// The server scores every alive posting once and ships each row's six feature values
// with it. Everything below re-ranks from those numbers in the browser, so the importance
// chips and the two hard-filter toggles never hit the network.

let resData = null;      // the whole /api/resume/matches payload, re-fetched on tab activation
let resImp = null;    // feature -> 0..3 chip position; the only weight state there is
let resFilters = { years: false, levels: false };
let resGapJob = "";      // job bucket picked in the skill-gap dropdown
let resPrevRank = null;  // id -> rank at the previous draw, for the ▲/▼ movement markers
let resFlush = null;     // pending debounced re-render after a skill edit; module-scoped so
                         // a render can cancel it — a timer armed by one render otherwise
                         // fires against the next one's DOM. Cosmetic only: cancelling it
                         // never loses a write, which is why the write is not on this timer.
let resSkillWrite = Promise.resolve();   // serializes the skill PATCHes, across re-renders
let resSkillErr = "";    // a save error with no card to show it on; the next render prints it

// No Title chip: research.matches() already drops postings whose title misses your
// target titles, so a title feature could only ever be 1.0. The server stopped
// scoring it; a stale `title` in localStorage is dropped by resLoadImp's key check.
const RES_LABELS = {
  semantic: "Semantic", skills: "Skills", years: "Years",
  level: "Level", recency: "Recency",
};
const RES_TOP = 50;      // render the top N only: 666 rows re-rendered on every change
                         // is visibly janky. Raise it if you want a longer list.

// Four discrete steps instead of a 0-100 range. resScore divides by the weight total, so
// only ratios survive — 4/4/4/4/4 ranks exactly like 1/1/1/1/1. The old sliders let
// you set five numbers that looked absolute and weren't. Off is a real 0: the feature
// drops out of both sides of the average rather than being weighted lightly.
const RES_STEPS = ["Off", "Low", "Normal", "High"];
const RES_STEP_W = [0, 1, 2, 4];
// ≈ the server's WEIGHTS (.32/.27/.17/.12/.12) at chip resolution.
const RES_IMP_DEFAULT = { skills: 3, semantic: 3, years: 2, level: 1, recency: 1 };
const RES_IMP_KEY = "jt.resume.importance";

/**
 * Read the saved importance chips back out of localStorage.
 *
 * localStorage is user-editable and survives across versions, so anything read back is
 * validated against the current feature list before it can reach resScore as a NaN.
 *
 * @param {string|null} raw - the stored JSON, or null when nothing is saved.
 * @returns {Object<string, number>} a full chip map: RES_IMP_DEFAULT with any valid
 *   saved value laid over it. Corrupt JSON, non-objects, unknown keys and
 *   out-of-range or non-integer values all fall back to the default.
 */
function resLoadImp(raw) {
  const out = { ...RES_IMP_DEFAULT };
  let saved;
  try { saved = JSON.parse(raw); } catch { return out; }
  if (!saved || typeof saved !== "object") return out;
  for (const k of Object.keys(RES_LABELS)) {
    if (Number.isInteger(saved[k]) && saved[k] >= 0 && saved[k] < RES_STEPS.length) out[k] = saved[k];
  }
  return out;
}

/**
 * Turn the chip positions into the weights resScore uses.
 * @param {Object<string, number>} levels - feature -> chip index (0..3).
 * @returns {Object<string, number>} feature -> weight from RES_STEP_W, so Off is a
 *   real 0 and the feature drops out of both sides of the average.
 */
const resWeightsOf = levels => Object.fromEntries(
  Object.keys(RES_LABELS).map(k => [k, RES_STEP_W[levels[k]]]));

/**
 * Score one posting from its features and the current chip weights.
 *
 * Mirrors resume.combine() in Python, including the imputation: a missing feature is
 * filled with that feature's corpus mean (`fills`, computed server-side and shipped
 * with the payload). Not 0 (penalizes a posting for a gap in what we scraped), not 1
 * (rewards it), and not "drop the term and renormalize" — that reads as fair but is
 * not, because the features are not equally generous, and it floated the postings we
 * know least about straight to the top.
 *
 * @param {Object<string, number|null>} features - the row's six feature values.
 * @param {Object<string, number>} weights - feature -> weight.
 * @param {Object<string, number>} [fills] - feature -> corpus mean.
 * @returns {number} the 0-1 score, or 0 when nothing weighted had a value. Iterates
 *   the weights, not the features, so an Off chip truly drops out.
 */
function resScore(features, weights, fills) {
  let sum = 0, total = 0;
  for (const [k, w] of Object.entries(weights)) {
    let v = features[k];
    if (v === null || v === undefined) v = fills ? fills[k] : undefined;
    if (v === null || v === undefined) continue;
    sum += w * v;
    total += w;
  }
  return total ? sum / total : 0;
}

/**
 * Which of the skills this slice of the market asks for do you already have?
 *
 * Reuses skillRates() for the market side, so the denominator is "share of postings
 * listing this skill" exactly as on the Salary tab. Coverage is weighted by
 * prevalence: matching a skill 90% of postings want counts for more than matching a
 * niche one, which is the question "am I employable here?"
 *
 * @param {object[]} rows - the postings in this slice.
 * @param {Set<string>} resumeSet - your skills, lowercased.
 * @param {number} [topN] - how many of the most-demanded skills to weigh.
 * @returns {{n: number, skills: {label: string, rate: number, have: boolean}[],
 *   coverage: number}} the slice size, each skill with its demand and whether you
 *   have it, and the prevalence-weighted share you cover (0 for an empty slice).
 */
function resumeGap(rows, resumeSet, topN = 22) {
  const { n, counts } = skillRates(rows);
  const skills = [...counts.entries()]
    .map(([key, e]) => ({ label: e.label, rate: n ? e.c / n : 0, have: resumeSet.has(key) }))
    .sort((a, b) => b.rate - a.rate)
    .slice(0, topN);
  const wanted = skills.reduce((t, s) => t + s.rate, 0);
  const met = skills.reduce((t, s) => t + (s.have ? s.rate : 0), 0);
  return { n, skills, coverage: wanted ? met / wanted : 0 };
}

/**
 * The skill gap as a bar chart.
 *
 * Same bar idiom as skillBarsSVG, but length encodes market demand and colour encodes
 * whether you have the skill — kept separate rather than threading two callbacks
 * through the shared function for two different meanings.
 *
 * @param {object} gap - resumeGap's output.
 * @param {number} width - the measured container width in px.
 * @returns {string} the SVG markup, or an empty-state paragraph when no skills have
 *   been extracted for this slice yet.
 */
function resumeGapSVG(gap, width) {
  const { skills } = gap;
  if (!skills.length) return `<p class="tm-empty">No skills extracted for this job title yet.</p>`;
  const HAVE = "var(--pair-a)", LACK = "var(--pair-b)";     // same CVD-safe pair as skillCompareSVG
  const W = Math.max(360, width), PAD_L = 170, PAD_R = 52, ROW = 22, TOP = 6;
  const H = TOP + skills.length * ROW + 4;
  const maxRate = skills[0].rate || 1, x1 = W - PAD_R;
  const sx = r => (r / maxRate) * (x1 - PAD_L);
  const clip = s => s.length > 24 ? s.slice(0, 23) + "…" : s;
  let svg = `<svg class="tm-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  skills.forEach((s, i) => {
    const y = TOP + i * ROW, w = Math.max(2, sx(s.rate));
    const fill = s.have ? HAVE : LACK;
    svg += `<text x="${PAD_L - 8}" y="${y + ROW / 2}" text-anchor="end" dominant-baseline="middle" class="row-name">${esc(clip(s.label))}</text>`
         + `<rect x="${PAD_L}" y="${y + 3}" width="${w}" height="${ROW - 8}" rx="3" fill="${fill}">`
         + `<title>${esc(s.label)}: ${Math.round(s.rate * 100)}% of postings ask for it — ${s.have ? "on your resume" : "NOT on your resume"}</title></rect>`
         + `<text x="${PAD_L + w + 5}" y="${y + ROW / 2}" dominant-baseline="middle" class="cap-val">${Math.round(s.rate * 100)}%</text>`;
  });
  return svg + `</svg>`;
}

/**
 * One posting's "why" column: its six features as scannable text.
 * @param {object} row - a scored result row, carrying its `features`.
 * @param {object} prof - the saved profile, for the years comparison.
 * @returns {string} the markup. An abstained feature renders as "—" so a gap in the
 *   scraped data is visible rather than silently folded into the score.
 */
function resFeatCells(row, prof) {
  const f = row.features;
  const pct = v => Math.round(v * 100) + "%";
  // one feature's cell: its value, or a muted dash when the feature abstained
  const bit = (k, text) => f[k] === null || f[k] === undefined
    ? `<span class="off">${RES_LABELS[k]} —</span>`
    : `<span>${RES_LABELS[k]} <b>${text}</b></span>`;
  const yrs = row.years_experience
    ? `${row.years_experience}y vs your ${prof.years_experience || 0}y`
    : "";
  return `<div class="feat">`
    + bit("skills", pct(f.skills))
    + bit("semantic", (f.semantic ?? 0).toFixed(2))
    + bit("years", yrs)
    + bit("level", esc(row.skill_level || ""))
    + bit("title", f.title === 1 ? "match" : "other")
    + bit("recency", `${row.found_at || ""}`)
    + `</div>`;
}

/**
 * Draw the whole Resume Analysis tab.
 *
 * Four panels: the resume itself (upload, text, skill chips), the shared profile, the
 * skill gap by job title, and the ranked postings. Everything below the fetch re-ranks
 * client-side, so the importance chips and the two hard-filter toggles never hit the
 * network.
 *
 * @returns {Promise<void>} replaces #resume's contents and wires every control. If
 *   the server has nothing to rank (no resume, no embedding), the two analysis panels
 *   show that error and the function returns early — the resume and profile panels
 *   still work, since they are how you fix it.
 */
async function renderResume() {
  const root = document.getElementById("resume");
  clearTimeout(resFlush);     // see resFlush: this render owns the DOM the timer targeted
  root.innerHTML = `<p class="tm-empty">Loading …</p>`;
  // Every render path goes through here, so this is the one place that guarantees the GET
  // below never overtakes a skill PATCH and redraws the list the user just edited away.
  // The chain always fulfils (its catch handles the failure), so this can't hang.
  await resSkillWrite;
  const [prof, data] = await Promise.all([
    api("GET", "/api/research/profile"),
    api("GET", "/api/resume/matches").catch(e => ({ error: e.message })),
  ]);
  const saved = await api("GET", "/api/resume").catch(() => ({}));
  resData = data;
  resImp = resImp || resLoadImp(localStorage.getItem(RES_IMP_KEY));
  resPrevRank = null;   // deltas mean "since your last change", not "since your last visit"

  root.innerHTML = `
    <div class="sal-card">
      <h2>Your resume</h2>
      <div class="res-row">
        <input type="file" id="resFile" accept=".pdf,.txt,.md">
        <button id="resSave" class="job">Save &amp; analyse</button>
        <span class="res-note" id="resStatus"></span>
      </div>
      <textarea class="res-text" id="resTextBox" spellcheck="false"
        placeholder="Upload a PDF above, or paste your resume text here."></textarea>
      <p class="res-note">PDF text extraction is imperfect on multi-column layouts — fix anything
        mangled above before saving, since the skill extraction and section matching both read it.</p>
      <div class="chips" id="resSkills" data-job-lock></div>
      <form class="res-row" id="resSkillForm" style="margin:8px 0 0" data-job-lock>
        <input id="resSkillIn" maxlength="50" placeholder="Add a skill" style="min-width:200px">
        <button>Add</button>
      </form>
    </div>

    <div class="sal-card">
      <h2>Confirm your profile</h2>
      <div class="res-row">
        <label>Years of experience<input type="number" id="resYears" min="0" max="60"></label>
        <label>Target job titles (one per line)
          <textarea id="resTitles" rows="4" style="min-width:260px;padding:8px;border:1px solid var(--rule-strong);border-radius:4px;font:inherit"></textarea>
        </label>
        <fieldset id="resLevels" style="border:1px solid var(--rule-strong);border-radius:4px;padding:6px 12px;display:flex;gap:12px;align-self:flex-end">
          <legend style="font-size:12px;color:var(--ink-2);padding:0 4px">Seniority</legend>
        </fieldset>
        <button id="resProfSave" style="align-self:flex-end">Save profile</button>
        <span class="res-note" id="resProfStatus"></span>
      </div>
      <p class="res-note">These are the same titles and levels the Job search and Salary tabs use —
        editing here changes them there too.</p>
    </div>

    <div class="sal-card" id="resGapCard">
      <h2>Skill gap by job title</h2>
      <div class="sal-skillbar">
        <label>Job title<select id="resGapSel"></select></label>
        <span class="res-note" id="resGapInfo"></span>
      </div>
      <div id="resGapOut"></div>
    </div>

    <div class="sal-card" id="resMatchCard">
      <h2>Best matching postings</h2>
      <p class="res-note" id="resWeightNote">How much should each thing count? Only the balance
        between them matters — everything on High ranks the same as everything on Normal.
        <a href="#" id="resWreset">Reset</a></p>
      <div class="res-weights" id="resWeightBox"></div>
      <div class="res-toggles">
        <label><input type="checkbox" id="resFiltYears">Hide roles needing more years than I have</label>
        <label><input type="checkbox" id="resFiltLevels">Hide levels outside my profile</label>
        <span class="res-note" id="resMatchInfo" style="margin-left:auto"></span>
      </div>
      <div id="resMatchOut"></div>
    </div>`;

  // --- resume panel
  const textBox = root.querySelector("#resTextBox");
  const status = root.querySelector("#resStatus");
  const skillsBox = root.querySelector("#resSkills");
  textBox.value = saved.text || "";
  let skills = commaToList(saved.skills);
  /**
   * Redraw the skill chips from the local `skills` list.
   * @returns {void} built with the DOM, not innerHTML: esc() leaves quotes alone, and
   *   a skill goes into the remove button's aria-label.
   */
  const showSkills = () => {
    skillsBox.textContent = "";
    const label = document.createElement("span");
    label.className = "chips-label";
    label.textContent = skills.length ? `${skills.length} skills found:`
                                      : "No skills yet.";
    skillsBox.append(label, ...skills.map((s, i) => {
      const chip = document.createElement("span");
      chip.textContent = s;
      const x = document.createElement("button");
      x.type = "button";
      x.className = "chip-x";
      x.dataset.i = i;
      x.textContent = "×";
      x.setAttribute("aria-label", `Remove ${s}`);
      chip.appendChild(x);
      return chip;
    }));
  };
  showSkills();
  if (saved.updated_at) status.textContent = `Saved ${saved.updated_at}`;
  if (resSkillErr) {
    // A save that failed while this render was already in flight had no #resStatus to
    // write to — it left the message here so the failure can't pass silently.
    status.className = "res-note err";
    status.textContent = resSkillErr;
    resSkillErr = "";
  }

  /**
   * Store an edited skill list and schedule the re-render it invalidates.
   *
   * Skills are stored as one comma-joined string and only feed coverage(), so an edit
   * is a cheap column write — no re-extraction, no re-embedding.
   *
   * The write goes out on the click and is never debounced: a tab switch or a window
   * resize re-renders, and a pending write would be cancelled with it — a deletion
   * that silently didn't happen. Only the re-render is debounced, since it blanks the
   * card (you can't click the next × mid-redraw) and re-scores every posting.
   * Requests carry the whole list, so they run through one promise chain rather than
   * in parallel.
   *
   * @param {string[]} next - the full list to store.
   * @returns {void} updates the chips immediately, PATCHes, and arms a 600ms
   *   re-render. A failed save parks its message where the next render will print it.
   */
  const saveSkills = next => {
    skills = next;
    showSkills();
    status.className = "res-note";
    status.textContent = "";
    let mine;                   // the re-render this call arms, below
    resSkillWrite = resSkillWrite
      .then(() => api("PATCH", "/api/resume/skills", { skills: next }))
      .catch(err => {
        // Cancel only our own re-render — a later click that succeeded is entitled to
        // its repaint. A render may have replaced these nodes, so find the live status.
        if (resFlush === mine) clearTimeout(resFlush);
        // Worded to hold either way: the chips may still show the edit, or a render may
        // have already put the stored list back.
        resSkillErr = `Could not save skills: ${err.message} — that change was not stored.`;
        const st = document.getElementById("resStatus");
        // No node while a render is mid-flight, and no point writing to a hidden tab —
        // either way it stays parked for the next render to print.
        if (st && st.offsetParent) {
          st.className = "res-note err";
          st.textContent = resSkillErr;
          resSkillErr = "";
        }
      });
    clearTimeout(resFlush);
    mine = resFlush = setTimeout(async () => {
      await renderResume();     // gap chart and every score read the new list
      root.querySelector("#resSkillIn").focus();
    }, 600);
  };
  skillsBox.onclick = ev => {
    const btn = ev.target.closest(".chip-x");
    if (btn) saveSkills(skills.filter((_, i) => i !== Number(btn.dataset.i)));
  };
  root.querySelector("#resSkillForm").onsubmit = ev => {
    ev.preventDefault();     // a <form> gets Enter-to-submit for free
    const box = root.querySelector("#resSkillIn");
    if (!box.value.trim()) return;
    const have = new Set(skills.map(s => s.toLowerCase()));
    // Split on commas: that is the storage delimiter, so one typed "React, Redux" has to
    // become two chips or it would silently split itself on the next load. The Set grows
    // as it goes, so "Go, go" adds one chip rather than two the server then collapses.
    const add = [];
    for (const s of commaToList(box.value)) {
      if (have.has(s.toLowerCase())) continue;
      have.add(s.toLowerCase());
      add.push(s);
    }
    if (add.length) { box.value = ""; saveSkills([...skills, ...add]); }
    else { status.className = "res-note"; status.textContent = "Already in the list."; }
  };

  root.querySelector("#resFile").onchange = async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    status.className = "res-note";
    status.textContent = `Reading ${file.name} …`;
    try {
      const res = await fetch("/api/resume/extract", {
        method: "POST",
        headers: { "X-Filename": file.name, "Content-Type": "application/octet-stream" },
        body: file,
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || res.statusText);
      textBox.value = d.text;
      status.textContent = `Read ${file.name} — check the text below, then Save & analyse.`;
    } catch (err) {
      status.className = "res-note err";
      status.textContent = err.message;
    }
  };

  const saveBtn = root.querySelector("#resSave");
  saveBtn.onclick = () => {
    if (!textBox.value.trim()) { status.className = "res-note err"; status.textContent = "Nothing to save."; return; }
    // This PUT re-extracts the skill list and overwrites the column, so the skill UI
    // (data-job-lock) goes inert for the run — see paintBusy.
    clearTimeout(resFlush);   // a pending skill re-render would race this PUT
    status.className = "res-note";
    status.textContent = "Extracting skills and embedding — this takes a while, watch the terminal …";
    return runJob(saveBtn, "Analysing…", async () => {
      try {
        const d = await runRemote("PUT", "/api/resume", {
          text: textBox.value,
          filename: root.querySelector("#resFile").files[0]?.name || null,
        });
        if (!d.ok) throw new Error("saved, but embedding failed — is sentence-transformers installed? See the terminal.");
        await renderResume();     // re-fetch: skills, years and every score just changed
      } catch (err) {
        const st = document.getElementById("resStatus");   // a re-render may have replaced it
        if (st) { st.className = "res-note err"; st.textContent = err.message; }
      }
    });
  };

  // --- confirm panel (shares the profile the other tabs read)
  const yearsBox = root.querySelector("#resYears");
  const titlesBox = root.querySelector("#resTitles");
  const levelsBox = root.querySelector("#resLevels");
  yearsBox.value = prof.years_experience || 0;
  titlesBox.value = (prof.titles || []).join("\n");
  for (const lvl of LEVELS) {
    const lab = document.createElement("label");
    lab.style.cssText = "flex-direction:row;align-items:center;gap:6px;text-transform:capitalize;font-size:12px";
    lab.innerHTML = `<input type="checkbox" value="${lvl}"><span></span>`;
    lab.querySelector("span").textContent = lvl;
    lab.querySelector("input").checked = (prof.levels || []).includes(lvl);
    levelsBox.appendChild(lab);
  }
  root.querySelector("#resProfSave").onclick = async ev => {
    const st = root.querySelector("#resProfStatus");
    ev.target.disabled = true;
    try {
      // set_profile merges, so sending these three leaves the rest of the profile alone
      await api("PATCH", "/api/research/profile", {
        years_experience: Number(yearsBox.value) || 0,
        titles: linesToList(titlesBox.value),
        levels: [...levelsBox.querySelectorAll("input:checked")].map(c => c.value),
      });
      renderResume();     // years and levels feed two of the five features; titles only
                          // gate what gets scraped, which is why there is no title one
    } catch (err) {
      st.className = "res-note err";
      st.textContent = err.message;
      ev.target.disabled = false;
    }
  };

  paintBusy();   // a run started before this render (tab switch) still owns these controls

  // --- the two analysis panels need a saved, embedded resume
  if (data.error) {
    root.querySelector("#resGapOut").innerHTML = `<p class="tm-empty">${esc(data.error)}</p>`;
    root.querySelector("#resMatchOut").innerHTML = `<p class="tm-empty">${esc(data.error)}</p>`;
    root.querySelector("#resWeightBox").innerHTML = "";
    root.querySelector("#resWeightNote").remove();
    if (data.pending) {
      root.querySelector("#resMatchInfo").textContent = `${data.pending} posting(s) not embedded yet`;
    }
    return;
  }

  const resumeSet = new Set(commaToList(data.resume_skills).map(s => s.toLowerCase()));
  const terms = prof.titles || [];

  // --- skill gap
  const gapSel = root.querySelector("#resGapSel");
  const gapOut = root.querySelector("#resGapOut");
  const gapInfo = root.querySelector("#resGapInfo");
  const buckets = jobBuckets(data.results.filter(r => r.skills), terms);
  gapSel.innerHTML = `<option value="">All postings</option>`
    + buckets.map(b => `<option value="${esc(b.label)}">${esc(b.label)} (${b.rows.length})</option>`).join("");
  if (buckets.some(b => b.label === resGapJob)) gapSel.value = resGapJob;
  /**
   * Redraw the skill-gap chart for the job title the dropdown names.
   * @returns {void} an empty pick means every skill-bearing posting. Also records the
   *   pick so it survives the next render.
   */
  const drawGap = () => {
    resGapJob = gapSel.value;
    const rows = resGapJob
      ? (buckets.find(b => b.label === resGapJob) || { rows: [] }).rows
      : data.results.filter(r => r.skills);
    const gap = resumeGap(rows, resumeSet);
    const W = Math.max(360, (gapOut.clientWidth || 820) - 40);
    gapInfo.textContent = `${gap.n} posting(s) · you have ${Math.round(gap.coverage * 100)}% of what they ask for, weighted by how often each skill comes up`;
    gapOut.innerHTML = resumeGapSVG(gap, W)
      + `<div class="tm-key"><span style="color:var(--pair-a)">■ on your resume</span>`
      + `<span style="color:var(--pair-b)">■ missing</span>`
      + `<span>Bar length: share of these postings that ask for the skill.</span></div>`;
  };
  gapSel.onchange = drawGap;
  drawGap();

  // --- matches
  const wBox = root.querySelector("#resWeightBox");
  const matchOut = root.querySelector("#resMatchOut");
  const matchInfo = root.querySelector("#resMatchInfo");
  const filtYears = root.querySelector("#resFiltYears");
  const filtLevels = root.querySelector("#resFiltLevels");
  filtYears.checked = resFilters.years;
  filtLevels.checked = resFilters.levels;

  /**
   * Draw the six importance controls from the current chip positions.
   * @returns {void} a radio group per feature: arrow keys move between steps and Tab
   *   skips to the next feature, both for free, which is why these are radios and not
   *   styled buttons.
   */
  const drawWeights = () => {
    wBox.innerHTML = Object.keys(RES_LABELS).map(k =>
      `<div class="wrow"><span class="wname">${RES_LABELS[k]}</span><span class="seg" role="radiogroup"
         aria-label="${RES_LABELS[k]} importance">`
      + RES_STEPS.map((s, i) =>
          `<input type="radio" name="wl-${k}" id="wl-${k}-${i}" value="${i}"
             ${resImp[k] === i ? "checked" : ""}><label for="wl-${k}-${i}">${s}</label>`).join("")
      + `</span></div>`).join("");
  };
  drawWeights();

  /**
   * Re-score, re-sort and redraw the ranked postings table.
   * @returns {void} applies the two hard filters, scores every surviving row with the
   *   current chip weights, and renders the top RES_TOP. With every chip Off there is
   *   nothing to rank, and it says so instead.
   */
  const drawMatches = () => {
    resFilters = { years: filtYears.checked, levels: filtLevels.checked };
    const resWeights = resWeightsOf(resImp);
    const myYears = prof.years_experience || 0;
    const wantLevels = new Set(prof.levels || []);
    const shown = data.results.filter(r => {
      // an unstated requirement (0/null) always survives: it is missing data, not a 0-year role
      if (resFilters.years && r.years_experience && r.years_experience > myYears) return false;
      if (resFilters.levels && wantLevels.size && r.skill_level && !wantLevels.has(r.skill_level)) return false;
      return true;
    });
    if (!Object.values(resWeights).some(Boolean)) {
      matchInfo.textContent = "";
      matchOut.innerHTML = `<p class="tm-empty">Everything is Off — turn at least one back on
        to rank these ${data.results.length} postings.</p>`;
      resPrevRank = null;
      return;
    }
    for (const r of shown) r._s = resScore(r.features, resWeights, data.fills);
    shown.sort((a, b) => b._s - a._s);
    const top = shown.slice(0, RES_TOP);
    matchInfo.textContent = `showing top ${top.length} of ${shown.length}`
      + (data.pending ? ` · ${data.pending} not embedded` : "");

    const rankNow = new Map(shown.map((r, i) => [r.id, i]));
    /**
     * How far one posting moved since the last draw.
     *
     * The answer to "did that do anything?", which a re-sorted table on its own never
     * gives you. Ranks come from the full filtered list, so a row can move without
     * entering or leaving the top N.
     *
     * @param {object} r - a result row.
     * @returns {string} a ▲/▼ marker, or "" when it didn't move or wasn't there before.
     */
    const moved = r => {
      const was = resPrevRank && resPrevRank.get(r.id);
      if (was === undefined || was === null) return "";
      const d = was - rankNow.get(r.id);
      return d > 0 ? `<span class="delta up" title="up ${d}">▲${d}</span>`
           : d < 0 ? `<span class="delta down" title="down ${-d}">▼${-d}</span>` : "";
    };

    matchOut.innerHTML = top.length ? `<table class="mkt-table">
      <thead><tr><th class="num">Match</th><th>Title</th><th>Company</th><th>Location</th><th>Why</th></tr></thead>
      <tbody>${top.map(r => `<tr>
        <td class="score">${Math.round(r._s * 100)}%${moved(r)}</td>
        <td>${safeHref(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>` : esc(r.title)}</td>
        <td>${esc(r.company || "")}</td>
        <td>${esc(r.location || "")}</td>
        <td>${resFeatCells(r, prof)}</td>
      </tr>`).join("")}</tbody></table>
      <div class="tm-key"><span>A feature shown as <span class="off">—</span> was never
      extracted for that posting; it scores as the average across these ${data.results.length}
      postings, so a gap is neither rewarded nor punished. Run the Job search tab's Check
      to fill more in.</span></div>`
      : `<p class="tm-empty">Nothing passes those filters.</p>`;
    resPrevRank = rankNow;
  };

  // One delegated listener for all six groups; the radio's name carries the feature.
  wBox.onchange = ev => {
    const k = (ev.target.name || "").slice(3);
    if (!(k in RES_LABELS)) return;
    resImp[k] = Number(ev.target.value);
    localStorage.setItem(RES_IMP_KEY, JSON.stringify(resImp));
    drawMatches();
  };
  root.querySelector("#resWreset").onclick = ev => {
    ev.preventDefault();
    resImp = { ...RES_IMP_DEFAULT };
    localStorage.removeItem(RES_IMP_KEY);
    drawWeights();
    drawMatches();
  };
  filtYears.onchange = drawMatches;
  filtLevels.onchange = drawMatches;
  drawMatches();
}

/**
 * Self-test: the busy flag survives a re-render, and fmtElapsed's formatting.
 *
 * The point of the flag: a re-render mid-run rebuilds the button, and the new one has
 * to come back disabled and labelled without the run knowing it happened.
 *
 * @returns {Promise<void>} console assertions, run against two throwaway buttons that
 *   are always removed afterwards.
 */
async function busySelfTest() {
  const box = document.createElement("div");
  box.innerHTML = `<button id="btA" class="job">A</button><button id="btB" class="job">B</button>`;
  document.body.appendChild(box);
  try {
    await runJob(document.getElementById("btA"), "Running…", async () => {
      eq(document.getElementById("btB").disabled, true, "busy: the other job button is disabled too");
      box.innerHTML = `<button id="btA" class="job">A</button><button id="btB" class="job">B</button>`;  // re-render
      eq(document.getElementById("btA").disabled, false, "busy: a fresh button starts enabled");
      paintBusy();
      eq(document.getElementById("btA").disabled, true, "busy: repaint re-disables the fresh button");
      eq(document.getElementById("btA").textContent, "Running…", "busy: repaint restores the label");
      // what runRemote does on each poll: the elapsed count rides on the same repaint
      busy.elapsed = 80; paintBusy();
      eq(document.getElementById("btA").textContent, "Running… 1m 20s", "busy: elapsed shown on the button");
    });
    eq(document.getElementById("btA").disabled, false, "busy: cleared when the run ends");
    eq(document.getElementById("btA").textContent, "A", "busy: idle label restored on the fresh button");
    eq(busy, null, "busy: flag cleared");

    eq(fmtElapsed(0), "0s", "elapsed: a job that just started");
    eq(fmtElapsed(8.4), "8s", "elapsed: rounded to whole seconds");
    eq(fmtElapsed(59), "59s", "elapsed: still seconds up to a minute");
    eq(fmtElapsed(60), "1m 00s", "elapsed: seconds are zero-padded past the minute");
    eq(fmtElapsed(605), "10m 05s", "elapsed: long runs read cleanly");
  } finally {
    box.remove();
  }
  console.log("busy self-test done");
}

/**
 * Self-test: resScore's imputation matches resume.combine(), the chips are
 * relative-only, resLoadImp validates, and resumeGap weights by prevalence.
 * @returns {void} console assertions.
 */
function resumeSelfTest() {
  const W = { semantic: .27, skills: .32, years: .17, level: .12, recency: .12 };
  eq(resScore({}, W), 0, "no features does not divide by zero");
  eq(resScore({ skills: null, years: null }, W), 0, "all-null does not divide by zero");
  eq(resScore({ skills: 1 }, { skills: .3 }), 1, "one present feature is its own mean");
  eq(resScore({ skills: 0.5 }, { skills: .3 }), 0.5, "single feature passes through");
  const full = { semantic: .8, skills: 1, years: 1, level: 1, recency: 1 };
  eq(resScore({ ...full, years: null, level: null }, W) > resScore({ ...full, years: 0, level: 0 }, W),
     true, "missing beats zero");
  eq(resScore({ skills: 1, semantic: 0 }, { skills: 1, semantic: 0 }), 1, "zero weight drops out");

  // the imputation must match resume.combine() in Python, or the chips would re-rank
  // into a different order than the server sent
  const F = { semantic: .5, skills: .17, years: .75, level: 1, recency: .79 };
  const miss = { semantic: .6, skills: null, years: .7, level: 1, recency: .8 };
  eq(Math.round(resScore(miss, W, F) * 1e9) / 1e9,
     Math.round(resScore({ ...miss, skills: F.skills }, W, F) * 1e9) / 1e9,
     "missing == average, exactly");
  eq(resScore({ ...miss, skills: .6 }, W, F) > resScore(miss, W, F), true,
     "real above-average skills beat missing skills");
  eq(resScore(miss, W, F) > resScore({ ...miss, skills: .02 }, W, F), true,
     "missing skills beat genuinely poor coverage");
  eq(resScore({ skills: null, recency: 1 }, { skills: .3, recency: .1 }, {}), 1,
     "no fill available -> renormalize over what is left");

  // the chips are relative-only: a uniform shift must not change the ranking
  const feats = { semantic: .4, skills: .9, years: .3, level: 1, recency: .5 };
  const lvA = { semantic: 1, skills: 1, years: 1, level: 1, recency: 1 };
  const lvB = { semantic: 3, skills: 3, years: 3, level: 3, recency: 3 };
  eq(resScore(feats, resWeightsOf(lvA), F), resScore(feats, resWeightsOf(lvB), F),
     "all-Low scores identically to all-High");
  eq(resWeightsOf({ ...RES_IMP_DEFAULT, recency: 0 }).recency, 0, "Off is weight 0");

  eq(resLoadImp(null), RES_IMP_DEFAULT, "no saved levels -> defaults");
  eq(resLoadImp("{oops"), RES_IMP_DEFAULT, "corrupt JSON -> defaults");
  eq(resLoadImp('{"skills":99,"nope":2}'), RES_IMP_DEFAULT, "out-of-range and unknown keys ignored");
  eq(resLoadImp('{"skills":0}').skills, 0, "a saved Off round-trips");
  eq(resLoadImp('{"skills":"3"}').skills, RES_IMP_DEFAULT.skills, "a string is not a level");

  const rs = new Set(["python", "go"]);
  const g = resumeGap([{ skills: "Python, Rust" }, { skills: "Python" }], rs);
  eq(g.n, 2, "posting count is the denominator");
  eq(g.skills.find(s => s.label === "Python").rate, 1, "in every posting");
  eq(g.skills.find(s => s.label === "Python").have, true, "matched case-insensitively");
  eq(g.skills.find(s => s.label === "Rust").have, false, "not on the resume");
  eq(Math.round(g.coverage * 100), 67, "coverage weighted by prevalence: 1.0 of 1.5");
  eq(resumeGap([], rs).coverage, 0, "empty slice does not divide by zero");
  console.log("resume self-test done");
}

/**
 * Self-test: parseSalary across the range of formats postings actually write.
 * @returns {void} console assertions.
 */
function parseSalarySelfTest() {
  const ps = s => { const r = parseSalary(s); return r && [Math.round(r.lo), Math.round(r.hi)]; };
  eq(ps("$225,000 - $320,000"),        [225000, 320000], "plain range");
  eq(ps("$170K - $320K base salary"),  [170000, 320000], "K notation + trailing words");
  eq(ps("180k - 300k"),                [180000, 300000], "no dollar sign, lowercase k");
  eq(ps("$163,418—$285,982 USD"),      [163418, 285982], "em-dash + USD suffix");
  eq(ps("$175,000 to $200,000"),       [175000, 200000], "'to' separator");
  eq(ps("USD$220,000.00 - $275,000.00"),[220000, 275000], "USD prefix + cents");
  eq(ps("$45 / hour"),                 [93600, 93600],   "hourly is annualized (45 * 2080)");
  eq(parseSalary(""),                  null,             "empty is null");
  eq(parseSalary("Competitive"),       null,             "no digits is null");
  eq(parseSalary("$5,000"),            null,             "below the salary floor is rejected");
  console.log("parseSalary self-test done");
}

/**
 * Self-test: locationBucket uses locations.py's mapping when there is one, and the
 * METROS fallback when there isn't.
 * @returns {void} console assertions.
 */
function locationBucketSelfTest() {
  // mapped by locations.py — the raw string is ignored entirely
  eq(locationBucket("Hybrid (NYC Metro)", "New York"), ["New York"], "mapped: raw shape is irrelevant");
  eq(locationBucket("SF | NYC | Seattle", "San Francisco,New York,Seattle"),
     ["San Francisco", "New York", "Seattle"], "mapped: several cities");
  eq(locationBucket("San Francisco, CA or Remote, US", "San Francisco,Remote"),
     ["San Francisco", "Remote"], "mapped: city and Remote both count");
  eq(locationBucket("Bengaluru, KA", " Bangalore , "), ["Bangalore"], "mapped: blanks and padding trimmed");
  // unmapped — the fallback, for rows locations.py has not reached
  eq(locationBucket("San Francisco, California, United States"), "San Francisco", "known metro by substring");
  eq(locationBucket("San Francisco Bay Area (Hybrid)"), "San Francisco", "metro collapses variants");
  eq(locationBucket("New York Office"), "New York", "metro ignores trailing words");
  eq(locationBucket("San Francisco, CA, US; Remote, US"), "San Francisco", "named city beats remote");
  eq(locationBucket("Remote - US"), "Remote",   "remote is detected");
  eq(locationBucket("Lincoln, Nebraska"), "Lincoln", "unknown place -> first comma segment");
  eq(locationBucket("Hybrid (NYC Metro)", ""), "Hybrid (NYC Metro)", "empty mapping falls through to raw");

/**
 * Self-test: salaryGroups fans a multi-key row into every bucket.
 * @returns {void} console assertions.
 */
function salaryGroupsSelfTest() {
  const row = (lo, hi, key) => ({ _sal: { lo, hi }, key });
  const one = salaryGroups([row(100, 200, "A")], r => r.key);
  eq(one.length, 1, "string key still makes one group");
  eq(one[0].n, 1, "string key counts once");
  const fan = salaryGroups([row(100, 200, ["A", "B"])], r => r.key);
  eq(fan.map(g => g.label).sort(), ["A", "B"], "array key fans out to every bucket");
  eq(fan.every(g => g.n === 1 && g.loMean === 100), true, "each bucket gets the whole band");
  eq(salaryGroups([row(100, 200, [])], r => r.key)[0].label, "Other", "no keys -> Other");
  console.log("salaryGroups self-test done");
}
/**
 * Self-test: salaryRangeSVG's group labels fit inside their gutter.
 *
 * The one thing that actually broke here: group labels are end-anchored in a fixed
 * left gutter, so a long one ("Machine Learning Engineer") ran off x=0 and got chopped
 * by the viewBox. Only the browser can answer "does this text fit" — so this measures
 * it with getBBox rather than estimating from character counts, which is exactly the
 * guess that let the bug through.
 *
 * @returns {void} console assertions, run against a hidden off-screen host that is
 *   always removed afterwards.
 */
function salaryRangeSVGSelfTest() {
  const g = (label, n) => ({ label, n, loMean: 100, loMed: 100, loSD: 10, hiMean: 200, hiMed: 200, hiSD: 20 });
  // render the chart off-screen and ask the browser whether every label starts at x >= 0
  const fits = labels => {
    const host = document.createElement("div");
    host.style.cssText = "position:absolute;visibility:hidden;left:0;top:0";
    host.innerHTML = salaryRangeSVG(labels.map(l => g(l, 104)), 1200);
    document.body.appendChild(host);
    const xs = [...host.querySelectorAll("text")].map(t => t.getBBox().x);
    host.remove();
    return Math.min(...xs) >= 0;
  };
  eq(fits(["Data Scientist", "AI Engineer"]), true, "short labels fit the gutter");
  eq(fits(["Machine Learning Engineer", "Forward Deployed Engineer"]), true,
     "the profile's own 25-char titles fit — these are the ones that used to be chopped");
  eq(fits(["Applied Research Scientist"]), true, "a title at the 26-char cap fits");
  eq(salaryRangeSVG([g("Senior Machine Learning Infrastructure Engineer", 3)], 1200).includes("…"),
     true, "past the cap the label is clipped rather than chopped");
  console.log("salaryRangeSVG self-test done");
}
