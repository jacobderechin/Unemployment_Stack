/**
 * Draw the Job search tab: the search profile, and the table of logged matches.
 * @returns {Promise<void>} replaces #market's contents and wires everything —
 *   the profile save, the Scan button, the three Check buttons, the title filter,
 *   the level checkboxes, and the sortable column headers. The filter and sort run
 *   over rows already on the page; only Save, Scan and Check hit the server.
 */
async function renderMarket() {
  const root = document.getElementById("market");
  const [profile, rows] = await Promise.all([
    api("GET", "/api/research/profile"),
    api("GET", "/api/research/matches"),
  ]);

  root.innerHTML = `
    <div class="mkt-profile">
      <h2>Search profile</h2>
      <div class="mkt-fields">
        <label>Job titles (one per line)<textarea id="mktTitles" rows="4"></textarea></label>
        <label>Locations (one per line — blank = anywhere)<textarea id="mktLocations" rows="4"></textarea></label>
        <fieldset id="mktLevels"><legend>Seniority (none = all)</legend></fieldset>
      </div>
      <div class="mkt-actions">
        <button id="mktSave">Save profile</button>
        <button id="mktScan" class="job">Scan</button>
        <button id="mktCheck" class="job" title="Visit every posting shown below: hide the dead ones, fill in salary, years and skills">Check postings</button>
        <button id="mktCheckAlive" class="job" title="Visit every posting shown below and hide the dead ones — no salary/years/skills, so no model calls (fast)">Check alive</button>
        <button id="mktCheckNew" class="job" title="Visit every posting shown below and hide the dead ones, but only send postings that have no salary/years/skills yet to the model">Check new</button>
        <span class="mkt-info" id="mktInfo"></span>
      </div>
    </div>
    <div class="mkt-filter">
      <label for="mktFilter">Filter titles</label>
      <input id="mktFilter" type="search" placeholder="senior -staff -principal" autocomplete="off">
      <details id="mktAddPanel">
        <summary>+ Add posting</summary>
        <form id="mktAddForm">
          <input name="url" type="url" placeholder="Job posting URL" required>
          <button type="button" id="mktFetch">Fetch</button>
          <input name="company" placeholder="Company" required>
          <input name="title" placeholder="Job title" required>
          <input name="location" placeholder="Location">
          <button type="submit">Add</button>
        </form>
      </details>
      <span class="mkt-info" id="mktCount"></span>
    </div>
    <table class="mkt-table">
      <thead><tr>
        <th data-sort="title"><button class="sort" type="button">Title</button></th>
        <th data-sort="company"><button class="sort" type="button">Company</button></th>
        <th data-sort="location"><button class="sort" type="button">Location</button></th>
        <th data-sort="skill_level"><button class="sort" type="button">Level</button></th>
        <th>Salary</th><th>Years</th>
        <th>URL</th><th></th>
      </tr></thead>
      <tbody id="mktRows"></tbody>
    </table>`;

  root.querySelector("#mktTitles").value = (profile.titles || []).join("\n");
  root.querySelector("#mktLocations").value = (profile.locations || []).join("\n");

  const levelsBox = root.querySelector("#mktLevels");
  const ticked = mktLevels ?? profile.levels ?? [];
  for (const lvl of LEVELS) {
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" value="${lvl}"><span></span>`;
    lab.querySelector("span").textContent = lvl;
    lab.querySelector("input").checked = ticked.includes(lvl);
    levelsBox.appendChild(lab);
  }
  // the seniority boxes ticked right now, read straight off the DOM
  const checkedLevels = () => [...levelsBox.querySelectorAll("input:checked")].map(c => c.value);

  const info = root.querySelector("#mktInfo");
  info.textContent = `Last scanned: ${profile.last_scanned || "never"} · ${rows.length} match${rows.length === 1 ? "" : "es"}`;

  const tbody = root.querySelector("#mktRows");
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="mkt-empty">No matches yet — set a profile and Scan.</td></tr>`;
  }
  const trs = [];
  for (const m of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="t"></td><td class="c"></td><td class="l"></td>
      <td class="level"></td><td class="salary"></td><td class="yrs"></td><td class="url"></td>
      <td><button class="del" title="Remove">&times;</button></td>`;
    tr.querySelector(".t").textContent = m.title;
    tr.querySelector(".c").textContent = m.company;
    tr.querySelector(".l").textContent = m.location || "";
    tr.querySelector(".level").textContent = m.skill_level || "";
    tr.querySelector(".salary").textContent = m.salary || "";
    // 0 means the posting states no requirement, null means we haven't checked it — both blank
    tr.querySelector(".yrs").textContent = m.years_experience || "";
    if (m.url && safeHref(m.url)) {
      const a = document.createElement("a");
      // set as a property, not interpolated into innerHTML, so a scraped url can't inject attributes
      a.href = m.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.title = m.url;
      a.textContent = m.url;
      tr.querySelector(".url").appendChild(a);
    } else if (m.url) {
      tr.querySelector(".url").textContent = m.url;   // a javascript:/data: url stays visible but inert, never clickable
    }
    tr.querySelector(".del").onclick = async () => {
      await api("DELETE", `/api/research/matches/${m.id}`);
      tr.remove();
      trs.splice(trs.findIndex(x => x[0] === tr), 1);
      applyFilter();                    // keep the "n of m shown" count honest
    };
    tbody.appendChild(tr);
    trs.push([tr, m]);
  }

  const filterBox = root.querySelector("#mktFilter");
  const count = root.querySelector("#mktCount");
  /**
   * Show or hide each row against the title box and the level checkboxes.
   * @returns {void} updates the "n of m shown" count too. Rows are hidden with
   *   `display`, not `hidden` — the UA's `tr { display: table-row }` can beat
   *   `[hidden]`.
   */
  const applyFilter = () => {
    const pass = titleFilter(filterBox.value);
    const passLevel = levelFilter(checkedLevels());
    let shown = 0;
    for (const [tr, m] of trs) {
      const ok = pass(m.title) && passLevel(m.skill_level);
      tr.style.display = ok ? "" : "none";
      if (ok) shown++;
    }
    count.textContent = trs.length ? `${shown} of ${trs.length} shown` : "";
  };
  filterBox.oninput = applyFilter;
  levelsBox.onchange = () => { mktLevels = checkedLevels(); applyFilter(); };   // change bubbles from the checkboxes

  const headers = [...root.querySelectorAll("th[data-sort]")];
  /**
   * Re-order the table to the active sort, and mark the header that drives it.
   * @returns {void} reorders the trs array, then re-appends each row. appendChild
   *   moves an existing node, so every row keeps its listeners and its filtered-out
   *   display state. No key set means the DB's own order stands.
   */
  const applySort = () => {
    for (const th of headers) {
      const active = th.dataset.sort === mktSort.key;
      th.setAttribute("aria-sort", !active ? "none" : mktSort.dir > 0 ? "ascending" : "descending");
      th.querySelector(".sort").dataset.arrow = active ? (mktSort.dir > 0 ? "▲" : "▼") : "";
    }
    if (!mktSort.key) return;
    trs.sort(byField(mktSort.key, mktSort.dir));   // stable, so ties keep newest-first DB order
    for (const [tr] of trs) tbody.appendChild(tr);
  };
  for (const th of headers) {
    th.querySelector(".sort").onclick = () => {
      const key = th.dataset.sort;
      mktSort = { key, dir: mktSort.key === key ? -mktSort.dir : 1 };
      applySort();
    };
  }

  applySort();     // re-apply the sort carried over from the last render
  applyFilter();

  root.querySelector("#mktSave").onclick = async () => {
    try {
      await api("PATCH", "/api/research/profile", {
        titles: linesToList(root.querySelector("#mktTitles").value),
        locations: linesToList(root.querySelector("#mktLocations").value),
        levels: checkedLevels(),
      });
      renderMarket();
    } catch (err) {
      alert("Could not save profile: " + err.message);
    }
  };

  const addForm = root.querySelector("#mktAddForm");

  // Fetch: read title/company/location off the pasted page (one Ollama call, a few
  // seconds) and prefill the fields so a bad parse is corrected before it's saved.
  const fetchBtn = root.querySelector("#mktFetch");
  fetchBtn.onclick = async () => {
    const url = addForm.url.value.trim();
    if (!url) return alert("Paste a job posting URL first.");
    fetchBtn.disabled = true;
    fetchBtn.textContent = "Reading…";
    try {
      const meta = await api("POST", "/api/research/parse", { url });
      if (meta.title) addForm.title.value = meta.title;
      if (meta.company) addForm.company.value = meta.company;
      if (meta.location) addForm.location.value = meta.location;
      if (!meta.title && !meta.company)
        alert("Couldn't read the title/company from that page — fill the fields in yourself.");
    } catch (err) {
      alert("Could not read that posting: " + err.message);
    } finally {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "Fetch";
    }
  };

  addForm.addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target;
    try {
      const res = await api("POST", "/api/research/add", {
        url: f.url.value, company: f.company.value, title: f.title.value, location: f.location.value,
      });
      f.reset();
      root.querySelector("#mktAddPanel").open = false;
      if (!res.created) alert("That URL is already in your list.");
      renderMarket();
    } catch (err) {
      alert("Could not add posting: " + err.message);
    }
  });

  const scanBtn = root.querySelector("#mktScan");
  scanBtn.onclick = () => runJob(scanBtn, "Scanning…", async () => {
    try {
      const res = await runRemote("POST", "/api/research/scan");   // polls until research.py finishes
      if (!res.ok) alert("Scan had problems — check the terminal running the app.");
      await renderMarket();
    } catch (err) {
      alert("Scan failed: " + err.message);
    }
  });

  // The three Check buttons differ only in the mode they post; enrich.py does the rest.
  // All three visit every posting shown, so all three prune the dead ones — they differ
  // in which rows reach the model, which is what a run's time is actually spent on.
  const CHECK_MODES = {
    mktCheck:      { mode: "full",  ask: n => `Visit ${n} posting${n === 1 ? "" : "s"} and enrich them all? Dead ones will be hidden.` },
    mktCheckAlive: { mode: "alive", ask: n => `Visit ${n} posting${n === 1 ? "" : "s"} for liveness only? Dead ones will be hidden; salary/years/skills stay as they are.` },
    mktCheckNew:   { mode: "new",   ask: n => `Visit ${n} posting${n === 1 ? "" : "s"} and enrich only the ones not enriched yet? Dead ones will be hidden.` },
  };
  for (const id of Object.keys(CHECK_MODES)) {
    const btn = root.querySelector("#" + id);
    const { mode, ask } = CHECK_MODES[id];
    btn.onclick = () => {
      // only the rows actually on screen, so the title/level filters bound the run
      const ids = trs.filter(([tr]) => tr.style.display !== "none").map(([, m]) => m.id);
      if (!ids.length) return alert("No postings shown — nothing to check.");
      if (!confirm(ask(ids.length))) return;
      return runJob(btn, "Checking…", async () => {     // one run at a time; they share the DB
        try {
          const res = await runRemote("POST", "/api/research/check", { ids, mode });  // polls until enrich.py finishes
          if (!res.ok) alert("Check had problems — see the terminal running the app.");
          await renderMarket();
          // A check re-embeds what it rewrote, so every resume score just moved. Switching
          // to that tab refetches anyway (VIEWS.resume.render); this is for the case the
          // tab is already open — a check blocks for minutes, which is long enough to go
          // wait on the resume screen and watch it not update. Skipped when it's hidden:
          // the next activation does the same fetch.
          if (document.getElementById("resume").classList.contains("active"))
            await renderResume();
        } catch (err) {
          alert("Check failed: " + err.message);
        }
      });
    };
  }

  paintBusy();   // a run started before this render (tab switch) still owns these buttons
}

// --- tabs ---
// Each entry names its tab button, its view element, and how to (re)draw it.
const VIEWS = {
  board:   { tab: "tabBoard",    el: "board",   render: () => {} },          // render() already ran in load()
  timing:  { tab: "tabTiming",   el: "timing",  render: () => renderTiming(allJobs) },
  heatmap: { tab: "tabActivity", el: "heatmap", render: () => renderHeatmap(allJobs) },
  flow:    { tab: "tabFlow",     el: "flow",    render: () => renderFlow(allJobs) },
  market:  { tab: "tabMarket",   el: "market",  render: renderMarket },
  salary:  { tab: "tabSalary",   el: "salary",  render: renderSalary },
  resume:  { tab: "tabResume",   el: "resume",  render: renderResume },
};
/**
 * Switch to one tab.
 * @param {string} name - a key of VIEWS.
 * @returns {void} moves the active class on both the button and the view, and renders
 *   the one that just became active.
 */
function showTab(name) {
  for (const [key, v] of Object.entries(VIEWS)) {
    const active = key === name;
    document.getElementById(v.tab).classList.toggle("active", active);
    document.getElementById(v.el).classList.toggle("active", active);
    if (active) v.render();
  }
}
for (const [name, v] of Object.entries(VIEWS))
  document.getElementById(v.tab).onclick = () => showTab(name);

/**
 * Redraw whichever view is currently on screen.
 * @returns {void} used after a resize and after a theme flip, both of which
 *   invalidate charts without changing any data.
 */
const renderActive = () => {
  for (const v of Object.values(VIEWS))
    if (document.getElementById(v.el).classList.contains("active")) v.render();
};

// The SVG charts measure clientWidth once at render and never again, so a resize past
// a breakpoint would otherwise leave them drawn at the old width. One debounced
// handler covers every view, rather than a ResizeObserver each.
let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderActive, 150); });

// --- theme ---
const themeBtn = document.getElementById("themeBtn");

/**
 * Label the theme button with what pressing it will do.
 * @returns {void} sets both the text and the aria-label from the current theme, so
 *   the button reads as the opposite of what is on screen.
 */
const labelTheme = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  themeBtn.textContent = dark ? "Light" : "Dark";
  themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
};
labelTheme();
themeBtn.onclick = () => {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.classList.add("theme-switching");
  root.dataset.theme = localStorage.theme = next;
  void root.offsetWidth;   // commit the new values before transitions come back on
  root.classList.remove("theme-switching");
  labelTheme();
  renderActive();          // charts that cache a measured width redraw against the new tokens
};

document.getElementById("add").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api("POST", "/api/jobs", {
      company: f.company.value,
      title: f.title.value,
      applied_date: f.applied_date.value,
    });
    f.reset();
    document.getElementById("addPanel").open = false;
    load();
  } catch (err) {
    alert("Could not add job: " + err.message);
  }
});

const dialog = document.getElementById("editDialog");
const editForm = document.getElementById("editForm");
let editingId = null;

/**
 * Open the edit dialog on one application.
 * @param {object} job - the row to edit.
 * @returns {void} fills the form, lists whichever milestone dates the job carries
 *   (each with a Delete that clears it and reloads the board behind the dialog), and
 *   shows the modal. The form's own submit handler saves the rest.
 */
function openEdit(job) {
  editingId = job.id;
  editForm.elements.company.value = job.company;
  editForm.elements.title.value = job.title;
  editForm.elements.applied_date.value = job.applied_date;

  const box = document.getElementById("editMilestones");
  box.innerHTML = "";
  for (const [field, label] of MILESTONES) {
    if (!job[field]) continue;
    const row = document.createElement("div");
    row.className = "edit-ms";
    row.innerHTML = `<span class="lbl"></span><span class="val"></span><button type="button" class="clear">Delete</button>`;
    row.querySelector(".lbl").textContent = label;
    row.querySelector(".val").textContent = job[field];
    row.querySelector(".clear").onclick = async () => {
      try {
        await api("PATCH", `/api/jobs/${job.id}`, { [field]: "" });
        row.remove();
        load();  // refresh the board behind the dialog
      } catch (err) {
        alert("Could not delete date: " + err.message);
      }
    };
    box.appendChild(row);
  }
  dialog.showModal();
}

document.getElementById("editCancel").onclick = () => dialog.close();

editForm.addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await api("PATCH", `/api/jobs/${editingId}`, Object.fromEntries(new FormData(editForm)));
    dialog.close();
    load();
  } catch (err) {
    alert("Could not save: " + err.message);
  }
});

const syncBtn = document.getElementById("syncBtn");
const lastSynced = document.getElementById("lastSynced");

/**
 * Write the sync watermark into the header.
 * @param {string|null} d - the last-synced date, or null when there isn't one.
 * @returns {string} the text that was set.
 */
const showSynced = d => lastSynced.textContent = "Last synced: " + (d || "never");

syncBtn.onclick = () => runJob(syncBtn, "Syncing…", async () => {
  try {
    const res = await runRemote("POST", "/api/sync");   // polls until ingest finishes
    showSynced(res.last_synced);
    if (!res.ok) alert("Sync had problems — check the terminal running the app.");
    await load();
  } catch (err) {
    alert("Sync failed: " + err.message);
  }
});

const authBtn = document.getElementById("authBtn");
// "Reconnecting…" — opens a Google consent tab if the refresh token is dead
authBtn.onclick = () => runJob(authBtn, "Reconnecting…", async () => {
  try {
    await api("POST", "/api/auth");
    alert("Gmail reconnected. You can Sync now.");
  } catch (err) {
    alert("Reconnect failed: " + err.message);
  }
});

api("GET", "/api/sync").then(r => showSynced(r.last_synced)).catch(() => {});
load();
</script>
</body>
